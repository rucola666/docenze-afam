<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSIZIONI AFAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --sfondo: #FCFDFD;
  --accento: #0066CC;
  --accento-2: #FF0000;
  --contrasto: #000000;
  --neutro-1: #E8E8E8;
  --neutro-2: #525252;
  --font-size: 20px;
  --font-size-mobile: 14px;
  --testo: lowercase;
  --weight-1: 420;
  --weight-2: 570;
  --weight-3: 720;
  --raggio-bottoni: 10px;
  --raggio-card: 30px;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  text-transform: var(--testo);
  background: var(--sfondo);
  color: var(--accento);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  font-size: var(--font-size);
  background: var(--sfondo);
  text-transform: var(--testo);
  padding: 10px 10px;
  border-bottom: 2px solid var(--neutro-1);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header-testo {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.br-mobile {
  display: none;
}

header h1 {
  font-size: var(--font-size);
  font-weight: var(--weight-3);
  text-transform: var(--testo);
  letter-spacing: 0;
  white-space: nowrap;
}

.header-sottotitolo {
  font-weight: var(--weight-1);
  color: var(--accento);
  margin-top: 0;
  margin-left: auto;
  letter-spacing: 0;
  white-space: nowrap;
}

.header-conteggio {
  display: none;
}

main {
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);

  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#filtri {
  width: 33.333%;
  min-width: 33.333%;
  overflow-y: auto;
  padding: 20px;
  border-right: 2px solid var(--neutro-1);
  background: var(--sfondo);
}

#offerte {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.filtro-categoria {
  margin-bottom: 14px;
}

.filtro-titolo {
  color: var(--accento);
  letter-spacing: 0;
  margin-bottom: 10px;
}

.filtro-bottoni {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filtro-bottone {
  font-size: var(--font-size);
  font-weight: var(--weight-1);
  background: var(--neutro-1);
  color: var(--neutro-2);
  text-transform: var(--testo);
  border: 1px solid transparent;
  border-radius: var(--raggio-bottoni);
  padding: 1px 7px;
  font-family: 'Titillium Web', sans-serif;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filtro-bottone:hover {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-bottone.attivo {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-bottone.attivo.azzerato {
  background: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown {
  position: relative;
}

.filtro-dropdown-trigger {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 0;
  transition: all 0.15s ease;
}

.filtro-dropdown-trigger:hover,
.filtro-dropdown-trigger.ha-filtri,
.filtro-dropdown-trigger.aperto {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-dropdown-trigger.ha-azzerati {
  background: var(--accento-2);
  border-color: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown-toggle {
  line-height: 1;
}

.filtro-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--sfondo);
  border: 0px solid var(--neutro-2);
  z-index: 200;
  padding: 6px;
}

.filtro-dropdown-menu.aperto {
  display: block;
  position: static;
  margin-top: 6px;
  width: 100%;
}

.filtro-dropdown-menu::-webkit-scrollbar {
  width: 6px;
}

.filtro-dropdown-menu::-webkit-scrollbar-thumb {
  background: var(--neutro-2);
}

.filtro-dropdown-menu .filtro-codice-toggle {
  margin-top: 6px;
  margin-bottom: 6px;
}

.filtro-reset {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  margin-top: 7px;
  transition: all 0.15s ease;
}

.filtro-reset:hover {
  background: var(--accento);
  color: var(--sfondo);
}

.lista-offerte {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 900px) {
  .lista-offerte {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 20px;
  position: relative;
  transition: border-color 0.15s ease;
  min-width: 0;
  overflow-wrap: break-word;
}

.card:hover {
  border-color: var(--accento);
}

.card-disciplina {
  font-weight: var(--weight-3);
  color:  var(--accento);
  line-height: 1.1;
  margin-bottom: 3px;
}

.card-info-icon {
  position: absolute;
  top: 20px;
  right: 20px;
  color: var(--accento);
  cursor: pointer;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  height: 1em;
}

.card .tooltip {
  display: none;
  position: absolute;
  top: 34px;
  right: 20px;
  width: calc(100% - 40px);
  background: var(--neutro-1);
  color: var(--contrasto);
  border: 1px solid var(--contrasto);
  padding: 12px;
  font-weight: var(--weight-1);
  line-height: 1.15;
  z-index: 1000;
  white-space: normal;
}

.card:has(.card-info-icon:hover) .tooltip,
.card:has(.tooltip:hover) .tooltip {
  display: block;
    color: var(--neutro-2);
}

.card-campo {
  font-weight: var(--weight-2);
  margin-bottom: 3px;
  line-height: 1.4;
}

.card-valore-puro {
  color: var(--contrasto);
}

.card-etichetta {
  color: var(--neutro-2);
  font-weight: 400;

}

.card-valore {
  color: var(--contrasto);
}

.card-id,
.card-id:visited {
  color: var(--accento);
  text-decoration: none;
}

.card-id:hover {
  color: var(--accento);
  text-decoration: none;
}

.card.offerta-scaduta,
.card.offerta-scaduta .card-disciplina,
.card.offerta-scaduta .card-valore-puro,
.card.offerta-scaduta .card-valore,
.card.offerta-scaduta .card-etichetta,
.card.offerta-scaduta .card-id,
.card.offerta-scaduta .card-id:visited {
  color: var(--neutro-1);
}

.card.offerta-scaduta .card-info-icon {
  color: var(--neutro-1);
}

.card.offerta-scaduta:hover {
  border-color: var(--neutro-1);
}

#filtri::-webkit-scrollbar,
#offerte::-webkit-scrollbar {
  width: 6px;
}

#filtri::-webkit-scrollbar-track,
#offerte::-webkit-scrollbar-track {
  background: transparent;
}

#filtri::-webkit-scrollbar-thumb,
#offerte::-webkit-scrollbar-thumb {
  background: var(--neutro-1);
}

@media (max-width: 768px) {
  :root {
    --font-size: var(--font-size-mobile);
  }

  body {
    height: auto;
    overflow: visible;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 300;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 16px;
    row-gap: 0;
    align-items: start;
  }

  .header-testo {
    display: contents;
  }

  header h1 {
    grid-column: 1;
    grid-row: 1 / 3;
    white-space: normal;
    align-self: start;
    line-height: 1;
  }

  .header-sottotitolo {
    grid-column: 2;
    grid-row: 1 / 3;
    justify-self: end;
    align-self: start;
    margin-left: 0;
    white-space: normal;
    text-align: right;
    line-height: 1;
  }

  .br-mobile {
    display: block;
  }

  .hyphen {
    display: none;
  }

  main {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }

  #filtri {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--neutro-1);
    overflow-x: auto;
    display: none;
  }

  #filtri.aperto {
    display: block;
  }

  .card .tooltip,
  .card-info-icon {
    display: none;
  }

  .filtro-bottoni {
    flex-wrap: nowrap;
  }

  .filtro-dropdown-menu .filtro-bottoni {
    flex-wrap: wrap;
  }

  .filtro-dropdown-menu .filtro-bottone {
    flex: 0 1 auto;
  }

  .filtro-bottone-luogo {
    white-space: nowrap;
  }

  .filtro-bottone-disciplina {
    white-space: normal;
    overflow-wrap: break-word;
  }

  .filtro-bottone {
    line-height: 1;
  }

  .filtro-dropdown-trigger {
    line-height: 1;
  }

  .filtro-reset {
    line-height: 1;
  }

  .filtri-toggle {
    background: transparent;
    color: var(--accento);
    border: 2px solid var(--accento);
    border-radius: var(--raggio-bottoni);
    padding: 6px 10px;
    font-family: 'Titillium Web', sans-serif;
    font-size: var(--font-size);
    font-weight: var(--weight-2);
    text-transform: var(--testo);
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filtri-toggle.ha-filtri {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtri-toggle.ha-azzerati {
    background: var(--accento-2);
    border-color: var(--accento-2);
    color: var(--sfondo);
  }

  .filtro-dropdown-menu .filtro-codice-toggle {
    display: none;
  }

  .header-conteggio {
    display: block;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: calc(var(--font-size) * 1.5);
    font-weight: var(--weight-3);
    line-height: 1;
    color: var(--contrasto);
  }

  .offerte-bar .offerte-conteggio {
    display: none;
  }

  #offerte {
    overflow: visible;
  }

  .card {
    padding: 14px;
  }
}
  </style>
</head>
<body>
  <header>
    <div class="header-testo">
      <h1>docenze<span class="hyphen">-</span><br class="br-mobile">afam--+</h1>
      <div class="header-sottotitolo">docenze bandite <br class="br-mobile">al __DATA_AGG__</div>
    </div>
    <div class="header-conteggio"></div>
  </header>
  <main>
    <aside id="filtri"></aside>
    <section id="offerte"></section>
  </main>
  <script>
const offerte = __DATA__;

const categorie = {
  scuole: { campo: 'tipo_scuola', titolo: 'Scuola', tipo: 'bottoni' },
  contratti: { campo: 'tipo_contratto', titolo: 'Contratto', tipo: 'bottoni' },
  luoghi: { campo: 'dove', titolo: 'Luogo', tipo: 'dropdown' },
  discipline: { campo: 'discipline_nomi', titolo: 'Disciplina', tipo: 'dropdown', codice: 'codice_sector' }
};

const filtriAttivi = {};
Object.keys(categorie).forEach(k => { filtriAttivi[k] = new Set(); });

let ordinamentoScadenza = false;
let mostraCodiciAfam = false;
let filtriAperti = false;
let filtriTotali = 0;
let haAzzeratiGlobali = false;
const dropdownAperti = new Set();

const codicePerDisciplina = new Map();
offerte.forEach(o => {
  const nome = (o.discipline_nomi || '').trim();
  const cod = (o.codice_sector || '').trim();
  if (nome && cod && !codicePerDisciplina.has(nome)) {
    codicePerDisciplina.set(nome, cod);
  }
});

function labelValore(val) {
  return (val === '') ? '/' : val;
}

function etichettaDisciplina(valore) {
  if (!mostraCodiciAfam) return labelValore(valore);
  const cod = codicePerDisciplina.get(valore);
  if (valore === '' || !cod) return '/';
  return cod.replace(/^AFAM/, '');
}

function applicaFiltri(filtri) {
  return offerte.filter(o => {
    return Object.keys(categorie).every(key => {
      const set = filtri[key];
      if (!set || set.size === 0) return true;
      return set.has(o[categorie[key].campo]);
    });
  });
}

function conteggiaValori(lista, campo) {
  const m = new Map();
  lista.forEach(o => {
    const v = (o[campo] || '').trim() === '' ? '' : o[campo];
    m.set(v, (m.get(v) || 0) + 1);
  });
  return m;
}

function configuraEtichetta(key, valore, conf, mostraCodici) {
  if (conf.codice) return etichettaDisciplina(valore);
  if (key === 'contratti') {
    const abbrev = {
      'altri contratti': 'altri',
      'tempo determinato': 'determinato',
      'tempo indeterminato': 'indeterminato'
    };
    const base = valore.toLowerCase();
    return abbrev[base] !== undefined ? abbrev[base] : labelValore(valore);
  }
  return labelValore(valore);
}

function renderFiltri() {
  const aside = document.getElementById('filtri');
  aside.innerHTML = '';
  filtriTotali = 0;
  haAzzeratiGlobali = false;

  Object.keys(categorie).forEach(key => {
    const conf = categorie[key];
    const filtriEsclusi = {};
    Object.keys(categorie).forEach(k => {
      if (k !== key) filtriEsclusi[k] = filtriAttivi[k];
    });
    const tutti = conteggiaValori(offerte, conf.campo);
    const base = applicaFiltri(filtriEsclusi);
    const conteggi = conteggiaValori(base, conf.campo);
    const items = [...tutti.keys()]
      .map((valore) => ({ valore: valore, etichetta: configuraEtichetta(key, valore, conf, mostraCodiciAfam), conteggio: conteggi.get(valore) || 0 }))
      .filter((it) => it.conteggio > 0 || filtriAttivi[key].has(it.valore))
      .sort((a, b) => a.etichetta.localeCompare(b.etichetta));
    renderFiltro(key, conf.titolo, items, conf.tipo, conf.codice);
    items.forEach(it => {
      if (filtriAttivi[key].has(it.valore)) {
        filtriTotali += 1;
        if (it.conteggio === 0) haAzzeratiGlobali = true;
      }
    });
  });

  const resetBtn = document.createElement('button');
  resetBtn.className = 'filtro-reset';
  resetBtn.textContent = 'reset';
  resetBtn.addEventListener('click', resetFiltri);
  aside.appendChild(resetBtn);

  if (filtriAperti) {
    aside.classList.add('aperto');
  } else {
    aside.classList.remove('aperto');
  }
}

function resetFiltri() {
  Object.keys(categorie).forEach(k => { filtriAttivi[k].clear(); });
  if (!window.matchMedia('(max-width: 768px)').matches) {
    dropdownAperti.clear();
  }
  renderFiltri();
  renderOfferte();
}

function renderFiltro(key, titolo, items, tipo, codice) {
  const aside = document.getElementById('filtri');
  const div = document.createElement('div');
  div.className = 'filtro-categoria';

  if (tipo === 'dropdown') {
    renderDropdown(div, key, titolo, items, codice);
  } else {
    const titleEl = document.createElement('div');
    titleEl.className = 'filtro-titolo';
    titleEl.textContent = titolo;
    div.appendChild(titleEl);
    renderBottoni(div, key, items);
  }

  aside.appendChild(div);
}

function renderBottoni(div, key, items) {
  const bottoni = document.createElement('div');
  bottoni.className = 'filtro-bottoni';
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'filtro-bottone';
    btn.textContent = it.etichetta + ' ' + it.conteggio;
    btn.dataset.categoria = key;
    btn.dataset.valore = it.valore;
    if (filtriAttivi[key].has(it.valore)) {
      btn.classList.add('attivo');
      if (it.conteggio === 0) btn.classList.add('azzerato');
    }
    btn.addEventListener('click', () => toggleFiltro(key, it.valore, btn));
    bottoni.appendChild(btn);
  });
  div.appendChild(bottoni);
}

function abbreviaNomeDisciplina(nome) {
  const parole = String(nome).trim().split(/\s+/).filter(Boolean);
  if (parole.length <= 3) return nome;
  return parole.slice(0, 3).join(' ') + '...';
}

function renderDropdown(div, key, titolo, items, codice) {
  const wrapper = document.createElement('div');
  wrapper.className = 'filtro-dropdown';

  const trigger = document.createElement('button');
  trigger.className = 'filtro-dropdown-trigger';
  const toggle = document.createElement('span');
  toggle.className = 'filtro-dropdown-toggle';
  toggle.textContent = '+\u00A0\u00A0\u00A0';
  const triggerLabel = document.createElement('span');
  triggerLabel.textContent = titolo;
  trigger.appendChild(toggle);
  trigger.appendChild(triggerLabel);

  const menu = document.createElement('div');
  menu.className = 'filtro-dropdown-menu';

  if (codice) {
    const toggleVista = document.createElement('button');
    toggleVista.className = 'filtro-reset filtro-codice-toggle';
    toggleVista.textContent = mostraCodiciAfam ? 'mostra nomi' : 'codici afam';
    toggleVista.addEventListener('click', () => {
      mostraCodiciAfam = !mostraCodiciAfam;
      renderFiltri();
    });
    menu.appendChild(toggleVista);
  }

  const bottoni = document.createElement('div');
  bottoni.className = 'filtro-bottoni';
  const mostraCodici = !!(codice && mostraCodiciAfam);
  const mobile = window.matchMedia('(max-width: 768px)').matches;
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'filtro-bottone';
    if (key === 'luoghi') btn.classList.add('filtro-bottone-luogo');
    if (key === 'discipline') btn.classList.add('filtro-bottone-disciplina');
    let etichetta = it.etichetta;
    if (codice && !mostraCodici && mobile) {
      etichetta = abbreviaNomeDisciplina(etichetta);
    }
    btn.textContent = (codice && mostraCodici) ? it.etichetta : (etichetta + '\u00A0' + it.conteggio);
    btn.dataset.categoria = key;
    btn.dataset.valore = it.valore;
    if (filtriAttivi[key].has(it.valore)) {
      btn.classList.add('attivo');
      if (it.conteggio === 0) btn.classList.add('azzerato');
    }
    btn.addEventListener('click', () => toggleFiltro(key, it.valore, btn));
    bottoni.appendChild(btn);
  });
  menu.appendChild(bottoni);

  const haAzzerati = items.some(it => filtriAttivi[key].has(it.valore) && it.conteggio === 0);
  if (haAzzerati) {
    trigger.classList.add('ha-azzerati');
  }

  trigger.addEventListener('click', () => {
    let aperto = menu.classList.toggle('aperto');
    trigger.classList.toggle('aperto', aperto);
    toggle.textContent = aperto ? '-\u00A0\u00A0\u00A0' : '+\u00A0\u00A0\u00A0';
    if (aperto) {
      dropdownAperti.add(key);
    } else {
      dropdownAperti.delete(key);
    }
  });

  if (dropdownAperti.has(key)) {
    menu.classList.add('aperto');
    trigger.classList.add('aperto');
    toggle.textContent = '-';
  }

  if (filtriAttivi[key].size > 0) {
    trigger.classList.add('ha-filtri');
  }

  wrapper.appendChild(trigger);
  wrapper.appendChild(menu);
  div.appendChild(wrapper);
}

function toggleFiltro(key, val, btn) {
  if (filtriAttivi[key].has(val)) {
    filtriAttivi[key].delete(val);
  } else {
    filtriAttivi[key].add(val);
  }
  renderFiltri();
  renderOfferte();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function titleCase(s) {
  if (!s) return s;
  return s.toLowerCase().split(/\s+/).map(function (w) {
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function parseDataBando(s) {
  const m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec((s || '').trim());
  if (!m) return null;
  const gg = parseInt(m[1], 10), mm = parseInt(m[2], 10), aaaa = parseInt(m[3], 10);
  const d = new Date(aaaa, mm - 1, gg);
  if (d.getFullYear() !== aaaa || d.getMonth() !== mm - 1 || d.getDate() !== gg) return null;
  return d.getTime();
}

function ordinaScadenza(lista, crescente) {
  const copia = lista.slice();
  copia.sort((a, b) => {
    const ta = parseDataBando(a.ultimo_giorno_candidatura);
    const tb = parseDataBando(b.ultimo_giorno_candidatura);
    const inA = ta === null;
    const inB = tb === null;
    if (inA && inB) return 0;
    if (inA) return 1;
    if (inB) return -1;
    if (ta === tb) return 0;
    return crescente ? (ta - tb) : (tb - ta);
  });
  return copia;
}

function renderOfferte() {
  let filtrate = applicaFiltri(filtriAttivi);
  if (ordinamentoScadenza !== null) {
    filtrate = ordinaScadenza(filtrate, ordinamentoScadenza);
  }

  const section = document.getElementById('offerte');
  section.innerHTML = '';

  const headerConteggio = document.querySelector('.header-conteggio');
  if (headerConteggio) {
    headerConteggio.textContent = String(filtrate.length);
  }

  const bar = document.createElement('div');
  bar.className = 'offerte-bar';
  bar.style.cssText = 'display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;';

  if (window.matchMedia('(max-width: 768px)').matches) {
    const filtriToggle = document.createElement('button');
    filtriToggle.className = 'filtri-toggle';
    filtriToggle.textContent = filtriAperti ? '-\u00A0\u00A0\u00A0filtri' : '+\u00A0\u00A0\u00A0filtri';
    if (filtriTotali > 0) filtriToggle.classList.add('ha-filtri');
    if (haAzzeratiGlobali) filtriToggle.classList.add('ha-azzerati');
    filtriToggle.addEventListener('click', () => {
      filtriAperti = !filtriAperti;
      renderFiltri();
      renderOfferte();
    });
    bar.appendChild(filtriToggle);
  }

  const count = document.createElement('div');
  count.className = 'offerte-conteggio';
  count.style.cssText = 'color: var(--contrasto); font-size: var(--font-size); font-weight: var(--weight-3);';
  const numero = document.createElement('span');
  numero.className = 'offerte-numero';
  numero.textContent = String(filtrate.length);
  const testo = document.createElement('span');
  testo.className = 'offerte-etichetta';
  testo.textContent = ' offert' + (filtrate.length === 1 ? 'a' : 'e') + ' trovat' + (filtrate.length === 1 ? 'a' : 'e');
  count.appendChild(numero);
  count.appendChild(testo);
  bar.appendChild(count);

  const sortBtn = document.createElement('button');
  sortBtn.className = 'filtro-bottone ordina-bottone';
  const etichettaOrd = ordinamentoScadenza === true ? 'Scadenza più vicina' : 'Scadenza più lontana';
  sortBtn.textContent = etichettaOrd;
  sortBtn.addEventListener('click', () => {
    ordinamentoScadenza = ordinamentoScadenza === true ? false : true;
    renderOfferte();
  });
  bar.appendChild(sortBtn);

  section.appendChild(bar);

  const grid = document.createElement('div');
  grid.className = 'lista-offerte';

  if (filtrate.length === 0) {
    const msg = document.createElement('p');
    msg.style.cssText = 'color: var(--neutro-1); font-size: var(--font-size); padding: 40px;';
    msg.textContent = 'Nessuna offerta trovata con i filtri selezionati.';
    grid.appendChild(msg);
  }

  const isMobile = window.matchMedia('(max-width: 768px)').matches;

  filtrate.forEach(o => {
    const card = document.createElement('div');
    card.className = 'card';

    const scadenzaTs = parseDataBando(o.ultimo_giorno_candidatura);
    if (scadenzaTs !== null && Date.now() > scadenzaTs + 86399999) {
      card.classList.add('offerta-scaduta');
    }

    const disc = document.createElement('div');
    disc.className = 'card-disciplina';
    disc.textContent = o.discipline_nomi ? o.discipline_nomi : '/';
    card.appendChild(disc);

    const infoWrap = document.createElement('span');
    infoWrap.className = 'card-info-icon';
    infoWrap.textContent = '+';
    const tip = document.createElement('div');
    tip.className = 'tooltip';
    tip.textContent = o.discipline_descrizione;
    card.appendChild(infoWrap);
    card.appendChild(tip);

    const campo = (label, value) => {
      const el = document.createElement('div');
      el.className = 'card-campo';
      const lbl = document.createElement('span');
      lbl.className = 'card-etichetta';
      lbl.textContent = label;
      const val = document.createElement('span');
      val.className = 'card-valore';
      val.textContent = value;
      el.appendChild(lbl);
      el.appendChild(val);
      return el;
    };

    const istituto = document.createElement('div');
    istituto.className = 'card-campo card-valore-puro';
    istituto.textContent = o.istituto ? o.istituto : '/';
    card.appendChild(istituto);

    card.appendChild(campo('Scade il ', (o.ultimo_giorno_candidatura || '').trim().replace(/-/g, '.')));

    if (!isMobile) {
      const idCampo = document.createElement('div');
      idCampo.className = 'card-campo';
      const idLabel = document.createElement('span');
      idLabel.className = 'card-etichetta';
      idLabel.textContent = 'Allegati ';
      idCampo.appendChild(idLabel);
      o.allegati.forEach((url, i) => {
        if (!url) return;
        const al = document.createElement('a');
        al.className = 'card-id';
        al.href = url;
        al.target = '_blank';
        al.rel = 'noopener';
        al.textContent = String(i + 1);
        idCampo.appendChild(al);
        if (i < o.allegati.length - 1) {
          idCampo.appendChild(document.createTextNode(' '));
        }
      });
      card.appendChild(idCampo);

      if (o.bando_inpa) {
        const inpaCampo = document.createElement('div');
        inpaCampo.className = 'card-campo';
        const inpaLabel = document.createElement('span');
        inpaLabel.className = 'card-etichetta';
        inpaLabel.textContent = 'Candidature ';
        const inpa = document.createElement('a');
        inpa.className = 'card-id';
        inpa.href = o.bando_inpa;
        inpa.target = '_blank';
        inpa.rel = 'noopener';
        inpa.textContent = 'portale reclutamento';
        inpaCampo.appendChild(inpaLabel);
        inpaCampo.appendChild(inpa);
        card.appendChild(inpaCampo);
      }

      const email = document.createElement('div');
      email.className = 'card-campo card-valore-puro';
      email.textContent = o.email_rup;
      card.appendChild(email);

      const telefono = document.createElement('div');
      telefono.className = 'card-campo card-valore-puro';
      telefono.textContent = '+39 ' + o.telefono_rup;
      card.appendChild(telefono);
    }

    grid.appendChild(card);
  });

  section.appendChild(grid);
}

renderFiltri();
renderOfferte();
  </script>
</body>
</html>
