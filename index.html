elaborazione e nella sperimentazione di nuovi linguaggi espressivi. Il settore comprende sia la formazione tecnico-operativa relativa ai settori di ricerca negli ambiti propri delle arti, della cinematografia, dell’audiovisivo, del documentario, sia gli strumenti metodologici e critici per l’acquisizione di competenze correlate ai linguaggi espressivi delle arti mediali. Il settore affronta altresì l’estetica e la semiotica dell’immagine in movimento, le tecniche di produzione della ripresa e del montaggio degli audiovisivi","codice_sector":"AFAM099","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Modellistica per il design","discipline_descrizione":"Il settore disciplinare fa riferimento alle strategie, ai metodi e alle tecniche atte a realizzare matericamente modelli e/o prototipi idonei a studiare, sviluppare, verificare e comunicare il progetto oggetto di indagine, in ogni sua fase. Il settore considera prioritaria la dotazione di competenze atte ad un uso ragionato del modello e/o prototipo in funzione dello sviluppo del progetto. Tenendo conto del continuo sviluppo tecnologico, sia specifico del settore che riferibile alle differenti realtà progettuali e produttive, lo studio deve fornire tutte le conoscenze concettuali, pratiche e strumentali, analogiche e/o digitali per sviluppare capacità sia manuali che di lavorazione assistita. Sono proprie del settore l’attenzione al recupero, alla valorizzazione ed alla preservazione di metodi e tecniche preesistenti ed una visione di ricerca, sperimentazione ed innovazione tesa all’interpretazione dell’intenzione progettuale","codice_sector":"AFAM100","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Scienze e tecniche della comunicazione","discipline_descrizione":"Il settore attraverso strumenti teorici che attingono alle scienze del linguaggio, alla semiotica (dell’immagine, del design e delle arti performative), alle teorie della comunicazione, indaga la complessità dei prodotti di comunicazione che popolano la cultura materiale e immateriale. L’ambito disciplinare privilegia competenze che permettono un’indagine critica delle strategie di comunicazione del prodotto, nonché permette l’acquisizione di capacità relative all’analisi e alla produzione di testi visivi e verbali, con riferimento alla specificità dei media utilizzati. Il settore comprende anche gli studi che hanno per oggetto le produzione dell’arte, come articolazioni di segni, e i fenomeni comunicativi connessi alla produzione artistica. Gli studi e la ricerca riguardano il design, la cultura visuale, i settori della comunicazione mediale, editoriale, istituzionale e d’impresa, come anche la valorizzazione del patrimonio culturale, con attenzione alle forme di comunicazione creativa adottate dallo spettacolo, dalla pubblicità e dal marketing culturale","codice_sector":"AFAM101","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Storia delle arti visive","discipline_descrizione":"Il settore comprende gli studi e le ricerche di carattere teorico, storico, metodologico negli ambiti della storia delle arti visive dall’antichità ai nostri giorni con particolare riferimento alla cultura occidentale per un’interpretazione critica delle manifestazioni artistiche dell’essere umano. La storia dell’arte è intesa elemento identitario della cultura in Italia e nell’ambito degli studi nel settore AFAM, nonché quale fattore necessario di consapevolezza civile sulla centralità del patrimonio artistico, la sua conservazione, tutela, valorizzazione e la sua trasmissione al futuro. Sono prese in esame con metodo interdisciplinare e nell’ottica della complessità le opere architettoniche, scultoree, pittoriche, grafiche fotografiche, installative e performative, con particolare attenzione agli agenti e ai fattori sociali che concorrono alla loro produzione nel contesto storico e culturale di appartenenza, nonché lo studio degli artisti, delle poetiche e dei movimenti artistici e il loro impatto sulla società. La disciplina studia le conseguenti modificazioni dei linguaggi anche in funzione dei cambiamenti delle tecniche e delle pratiche artistiche all’interno dell’orizzonte storico sociologico, estetico e culturale, dalle origini fino alle più attuali tendenze artistiche, non solo nelle tradizionali espressioni, ma anche con riferimento alle culture sceniche, coreografiche e filmiche, nonché in relazione alla produzione della società industriale e postindustriale, inclusa l’interazione e la contaminazione tra i nuovi e diversi linguaggi visivi, multimediali e con l’Intelligenza Artificiale. Include gli studi e le ricerche di iconografia e iconologia, di sociologia dell’arte, nonché quelli di carattere teorico e metodologico inerenti la critica d’arte, la letteratura artistica, la storia e la metodologia della storia dell’arte, la storia del collezionismo, la museologia, le relazioni tra le arti visive e le arti performative. Comprende infine gli studi le ricerche sulle tecniche artistiche, la storia e la teoria della conservazione e del restauro del patrimonio e le problematiche di conservazione dell’arte contemporanea","codice_sector":"AFAM102","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Storia delle arti applicate e del design","discipline_descrizione":"I contenuti scientifico-disciplinari del settore riguardano la ricerca e la didattica relativa a tutte le forme d’arte e di design, che pur essendo ovviamente collegate alle arti visive, hanno una loro specificità, in quanto applicate all’artigianato e all’industria. Un approccio storico che sottende all’acquisizione di una prassi di analisi e di operatività finalizzata alla progettazione. Gli studi del settore riguardano pertanto gli oggetti dal mobile al gioiello, dall’abito alla moda all’oggetto funzionale, dalla miniatura all’illustrazione contemporanea, dall’arazzo alla stoffa stampata, dal costume in tutte le sue applicazione, alla decorazione, al libro, alla stampa e all’editoria d’arte, includendo le competenze per il riconoscimento degli stili e il loro sviluppo nella storia dell’arte moderna e contemporanea. È inoltre analizzato da un punto di vista storico lo sviluppo delle metodiche di interazione con le diverse forme della comunicazione visiva nell’ambito della grafica, del libro, della comunicazione multimediale, considerando i relativi aspetti cognitivi e psicologici. I prodotti esemplificativi della storia delle arti applicate e del design sono visti inoltre come risultato delle diverse teorie e metodologie progettuali, come prodotto dello sviluppo tecnologico, come espressione della cultura di impresa nelle sue relazioni con lo sviluppo sociale, economico e culturale ed estetico che caratterizzano i diversi periodi storici","codice_sector":"AFAM103","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Pedagogia e didattica dell'arte e del design","discipline_descrizione":"Il settore comprende tre ambiti principali di ricerca, considerati in una prospettiva di reciprocità e interconnessione: 1:) teoretico e speculativo; 2:) applicativo e procedurale; 3:) sperimentale ed esperienziale. Studia gli aspetti storici e metodologici della pedagogia e delle teorie dell’educazione come percorso storico, socioculturale, politico e concettuale dell’educazione in Occidente nel legame società-educazione all’arte, con particolare riferimento alle problematiche contemporanee, nelle loro componenti sia di ordine filosofico che empirico, delineate in senso generale e specificatamente in relazione all’arte e ai diversi linguaggi artistici, compresi quelli audiovisivi. Il settore include anche gli studi e le ricerche sulla mediazione culturale e artistica, la filosofia dell’educazione, la letteratura per l’infanzia e le pratiche di animazione ludico-creative. In particolare, la didattica è riconsiderata alla luce delle innovazioni linguistiche delle arti contemporanee e delle nuove metodologie che ne derivano. Così contraddistinte, la sperimentazione e progettazione dei percorsi didattici, compreso il centrale ambito della didattica museale, sono indirizzate non solo alla formazione in luoghi istituzionali e scolastici ma in tutti gli altri possibili contesti educativi, anche informali, come strategia culturale e sociale, strumento trasferibile per l’avvicinamento al sapere e l’apprendimento in profondità e per favorire l’acquisizione delle competenze trasversali. I diversi linguaggi artistici sono dunque considerati chiavi interpretative di lettura per un’educazione al patrimonio materiale e immateriale e per la sua valorizzazione e tramite la mediazione culturale, dando forte attenzione alla pratica laboratoriale anche attraverso percorsi e strumenti multimediali. Vengono infine comprese sperimentazioni, mutuate dalle pratiche teatrali e dedicate alla corporeità nella relazione educativa, alle tecniche di narrazione e comunicazione, all’utilizzo consapevole del linguaggio verbale e non verbale","codice_sector":"AFAM107","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Antropologia e sociologia delle arti, del design e dello spettacolo","discipline_descrizione":"Il settore si articola in due ambiti: antropologico e sociologico. L’ambito antropologico ha come oggetto la riflessione sulle dinamiche simboliche e sociali delle culture, con particolare riferimento all’arte, al design, alla danza e al teatro. Analizza le società complesse e gli archetipi dell’immaginario, esplorati nelle molteplici varianti geografiche e storiche e nel prodursi di relazioni mutevoli tra le comunità umane e la natura, dal tribale al globale. Gli studi si inseriscono nei saperi delle arti e dei linguaggi contemporanei connessi con gli aspetti rituali e sociali. Sono inoltre oggetto di ricerca il folclore, le forme espressive popolari nel rapporto con altre forme della produzione letteraria e artistica e con le strutture antropologiche dell’immaginario. L’ambito sociologico contiene i presupposti teorici, storici e metodologici della ricerca sociale, dei nuovi media, dei processi culturali e della comunicazione, nonché gli strumenti utilizzati nell’analisi delle fenomeniche micro e macro-sociologiche: dai fenomeni della cultura, a quelli comunicativi, dai processi di socializzazione, all’impatto sociale delle arti, del design, della danza, del teatro, del costume, dei media e delle tecnologie avanzate","codice_sector":"AFAM109","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Progettazione grafica","discipline_descrizione":"Il settore disciplinare comprende contenuti progettuali-teorici, metodi, saperi e ambiti di ricerca della progettazione grafica. Il progetto grafico (graphic design) è un’attività che unisce componenti tecniche e culturali volte al raggiungimento di finalità di comunicazione eterogenee. Le competenze interdisciplinari che confluiscono nell’attività di progettazione grafica sono declinate nella molteplicità degli ambiti applicativi e di ricerca del progetto grafico, operando in maniera trasversale rispetto agli stessi. Ambiti principali di applicazione sono la grafica di pubblica utilità, l’editoria, la pubblicità e gli strumenti analogici, digitali e interattivi per i settori pubblici e privati. Il settore include, inoltre, discipline quali progettazione grafica, layout e tecniche di visualizzazione, progettazione editoriale, progettazione tipografica, disegno di caratteri, progettazione grafica dell’immagine spaziando dall’identità visiva, all’editoria, al packaging e alla progettazione di interfacce, nonché allo sviluppo di sistemi di segnaletica e mappature di orientamento. Determina ambiti di insegnamento e ricerca specifici tra attività tecnica e intellettuale finalizzata alla progettazione di artefatti comunicativi culturali anche attraverso l’uso sperimentale di strumenti e metodi innovativi","codice_sector":"AFAM110","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Teoria, storia e metodo dei mass media","discipline_descrizione":"Teoria, storia e metodo dei mass media è un settore che si concentra sulle forme, le strategie e le tecnologie che caratterizzano le comunicazioni di massa, con un’attenzione specifica al loro impatto socio-culturale. Il settore definisce la fenomenologia dei media nel loro rapporto con i linguaggi artistici e i loro mutamenti sia nel contesto comunicativo sia in quello espressivo. Sono ambiti di ricerca della disciplina la teoria dei media e l’analisi delle strutture linguistiche e comunicazionali connesse all’evoluzione dei mass media. All’interno della storia sociale le comunicazioni di massa hanno svolto un importante ruolo di mediazione, veicolando contenuti simbolici e contribuendo ai processi di costruzione dell’identità culturale e sociale. Nell’attuale società digitale e iperconnessa, i media svolgono un ruolo centrale in tutte le interazioni sociali e pervadono la gran parte delle attività culturali: dalla comunicazione all’educazione, dall’intrattenimento alle pratiche artistiche. Pertanto, vista l’ampiezza degli ambiti di interesse, la metodologia adottata è interdisciplinare e fa dialogare lo studio dei linguaggi multimediali, audiovisivi e digital con l’analisi sociologica dei processi comunicativi, la storia culturale e la cultura visuale","codice_sector":"AFAM119","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2168","istituto":"CONSERVATORIO DI MUSICA DI PESARO","discipline_nomi":"Accompagnamento pianistico","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle competenze tecniche, musicali, culturali ed interpretative finalizzate ad una piena conoscenza dei repertori dell’accompagnamento e della collaborazione pianistica, delle correlate prassi esecutive negli ambiti della musica vocale e strumentale dei diversi stili ed epoche, con particolare riferimento al teatro musicale. Prevede altresì l’approfondimento delle tecniche di lettura estemporanea e di trasposizione tonale, nonché la pratica e il trasferimento delle competenze proprie della figura del korrepetitor","codice_sector":"AFAM021","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"PESARO","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"25-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9862/download/BANDO","https://afam-anagrafiche.mur.gov.it/9878/download/BANDO","https://afam-anagrafiche.mur.gov.it/9861/download/BANDO","https://afam-anagrafiche.mur.gov.it/9864/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/99d235b81b294ab4b9a68c88cc65df58","email_rup":"direzione@conservatoriorossini.it","telefono_rup":"072134151"},{"bando_id":"2167","istituto":"CONSERVATORIO DI MUSICA DI PESARO","discipline_nomi":"Composizione","discipline_descrizione":"Il settore concerne la ricerca e lo studio dei processi creativi-compositivi (composizione originale, elaborazione, trascrizione, arrangiamento), nei vari generi e linguaggi musicali, storici e caratteristici della contemporaneità, compresa la composizione applicata alle immagini. In particolare il settore mira a sviluppare, attraverso l’analisi e l’esercizio compositivo nelle diverse formazioni strumentali e vocali, le competenze storicostilistiche e linguistiche in campo melodico, ritmico, armonico, contrappuntistico, timbrico, nonché le competenze tecnicoespressive relative all’uso della voce. Fondamentale aspetto di questo settore è lo studio delle forme compositive e delle tecniche della comunicazione musicale. Il settore concerne inoltre la didattica della composizione, con specifico riferimento all’applicazione in ambito formativo-educativo, in contesti scolastici ed extrascolastici","codice_sector":"AFAM041","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"PESARO","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"25-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9860/download/BANDO","https://afam-anagrafiche.mur.gov.it/9855/download/BANDO","https://afam-anagrafiche.mur.gov.it/9858/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/02af951bf05640fc9ad68fee155cad85","email_rup":"direzione@conservatoriorossini.it","telefono_rup":"072134151"},{"bando_id":"2166","istituto":"ACCADEMIA DI BELLE ARTI DI MILANO","discipline_nomi":"Progettazione grafica","discipline_descrizione":"Il settore disciplinare comprende contenuti progettuali-teorici, metodi, saperi e ambiti di ricerca della progettazione grafica. Il progetto grafico (graphic design) è un’attività che unisce componenti tecniche e culturali volte al raggiungimento di finalità di comunicazione eterogenee. Le competenze interdisciplinari che confluiscono nell’attività di progettazione grafica sono declinate nella molteplicità degli ambiti applicativi e di ricerca del progetto grafico, operando in maniera trasversale rispetto agli stessi. Ambiti principali di applicazione sono la grafica di pubblica utilità, l’editoria, la pubblicità e gli strumenti analogici, digitali e interattivi per i settori pubblici e privati. Il settore include, inoltre, discipline quali progettazione grafica, layout e tecniche di visualizzazione, progettazione editoriale, progettazione tipografica, disegno di caratteri, progettazione grafica dell’immagine spaziando dall’identità visiva, all’editoria, al packaging e alla progettazione di interfacce, nonché allo sviluppo di sistemi di segnaletica e mappature di orientamento. Determina ambiti di insegnamento e ricerca specifici tra attività tecnica e intellettuale finalizzata alla progettazione di artefatti comunicativi culturali anche attraverso l’uso sperimentale di strumenti e metodi innovativi","codice_sector":"AFAM110","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"MILANO","puoi_candidarsi_da":"25-08-2026","ultimo_giorno_candidatura":"14-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9853/download/BANDO","https://afam-anagrafiche.mur.gov.it/9852/download/BANDO"],"bando_inpa":"","email_rup":"segreteria.direzione@accademiadibrera.milano.it","telefono_rup":"0286955222"},{"bando_id":"2165","istituto":"ACCADEMIA DI BELLE ARTI DI MILANO","discipline_nomi":"Design del prodotto","discipline_descrizione":"Il Design del Prodotto riguarda i temi della ricerca e della progettazione di prodotti che soddisfino le esigenze funzionali, ergonomiche, formali, sociali ed etiche in sintonia con le esigenze del mercato e del benessere, nell’ottica degli obiettivi imprescindibili di una progettazione attenta e sostenibile per l’uomo, l’ambiente e le altre forme di vita che popolano il pianeta. I designer del prodotto lavorano su soluzioni innovative di processo o di prodotto che migliorino la vita quotidiana degli utenti e delle comunità, che rispondano a sfide tecnologiche, di innovazione tipologica, filosofiche e produttive contemporanee, che siano in grado di interpretare il futuro, attraverso un processo che abbracci la ricerca, la progettazione e lo sviluppo formale e per il tramite dell’uso di materiali congrui e sostenibili, anche di tipo avanzato. Il design del prodotto mira a sviluppare le idee progettuali in elaborati prevalentemente materiali, a supporto di un miglioramento della vita e del progresso sociale ed economico, tramite una solida formazione di base nell’ambito delle discipline del progetto, sia a livello interdisciplinare teorico e operativo. Il settore include inoltre la riflessione critica e la pratica responsabile del design, valutandone l’impatto sui sistemi complessi e le implicazioni morali, sociali, culturali e ambientali, promuovendo valori come integrità, giustizia, rispetto, sostenibilità e responsabilità, superando bias impliciti e pregiudizi per favorire pratiche inclusive. L’etica del design incoraggia comportamenti trasparenti e rispettosi, adattandosi alle sfide digitali e globali, mantenendo il benessere umano e l’equilibrio ambientale come priorità","codice_sector":"AFAM087","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"MILANO","puoi_candidarsi_da":"25-08-2026","ultimo_giorno_candidatura":"14-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9850/download/BANDO","https://afam-anagrafiche.mur.gov.it/9851/download/BANDO"],"bando_inpa":"","email_rup":"segreteria.direzione@accademiadibrera.milano.it","telefono_rup":"0286955222"},{"bando_id":"2163","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","discipline_nomi":"Metodi e strumenti per la rappresentazione del progetto","discipline_descrizione":"Il settore disciplinare si fonda sull’assunto culturale che la rappresentazione sia un’estensione del pensiero e un linguaggio universalmente riconosciuto di comunicazione. L’attività di ricerca, progettuale, artistica e didattico-formativa, sia teorica sia pratica, comprende l’insieme dei saperi, delle teorie, dei metodi e delle tecniche per la produzione di rappresentazioni bidimensionali e tridimensionali, sia analogiche sia digitali sia post-digitali, relative alle attività di ideazione alle diverse scale, dello spazio, del manufatto e dell’oggetto, sia reali sia immaginate, compresi i beni culturali","codice_sector":"AFAM083","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"25-08-2026","ultimo_giorno_candidatura":"15-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9843/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=9f67fb2bd01c442c ica e dell’interpretazione orchestrale, vista come elemento fondamentale della formazione musicale dello strumentista. Si affrontano i repertori delle varie epoche fino ai nostri giorni, fornendo competenze legate alle metodologie di lettura estemporanea e alle tecniche di intonazione. Il settore concerne altresì l’interpretazione, lo studio delle tecniche e delle prassi della concertazione e della direzione d’orchestra, dal piccolo ensemble alla grande formazione comprendente anche compagini vocali e corali, fino al teatro musicale. La formazione del direttore d’orchestra comporta l’approfondimento della teoria e dell’analisi della musica nonché la conoscenza degli strumenti musicali, dei linguaggi, degli stili e della storia","codice_sector":"AFAM049","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"POTENZA","puoi_candidarsi_da":"19-08-2026","ultimo_giorno_candidatura":"18-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9796/download/BANDO","https://afam-anagrafiche.mur.gov.it/9930/download/BANDO","https://afam-anagrafiche.mur.gov.it/9929/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area","email_rup":"affarigenerali@conservatoriopotenza.it","telefono_rup":"097146056"},{"bando_id":"2122","istituto":"CONSERVATORIO DI MUSICA DI POTENZA","discipline_nomi":"Coro","discipline_descrizione":"Il settore concerne la formazione corale, nella quale l’attenzione viene rivolta alla ricerca, allo studio e all’approfondimento dei principali repertori delle varie epoche fino ai nostri giorni, volte a far acquisire agli studenti competenze legate alle metodologie di lettura estemporanea e alle tecniche di intonazione. Il settore concerne altresì lo studio dell’interpretazione, delle tecniche e delle prassi della concertazione, della direzione di coro, applicato a formazioni corali di diverse dimensioni. La formazione del direttore di coro comporta l’approfondimento della composizione, della teoria e dell’analisi della musi attica dello strumento","codice_sector":"AFAM015","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"LATINA","puoi_candidarsi_da":"10-08-2026","ultimo_giorno_candidatura":"09-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9678/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/a1779796c2a14fb4946a34735a6033c3","email_rup":"direttore.amministrativo@conslatina.it","telefono_rup":"0773664173"},{"bando_id":"2075","istituto":"ACCADEMIA DI BELLE ARTI DI CARRARA","discipline_nomi":"Linguaggi e pratiche artistiche della decorazione","discipline_descrizione":"Il settore include le attività teorico - pratiche - laboratoriali riconducibili al concetto base di Decorazione, nel quale è compreso l’insieme degli approfondimenti che vanno dalla conoscenza dei materiali dell’arte sino all’esecuzione dell’opera in rapporto allo spazio, sia esso fisico o sociale, urbano o naturale. Nel settore sono comprese le convergenze interdisciplinari che vanno dal disegno alla pittura, dalla realizzazione plastica all’installazione, dal video alla performance, alla progettazione ed esecuzione di opere d’arte, opere esperienziali e relazionali che, sconfinando e contaminandosi con una dimensione funzionale, favoriscono il dialogo tra le arti visive, il territorio e la società, con l’architettura, con il paesaggio, con l’ambiente, e con il design nelle sue varie declinazioni. La centralità dell’attività laboratoriale garantisce un dialogo e un equilibrio tra tecniche consolidate della tradizione artistica, nuovi linguaggi e tecnologie applicabili alle arti e al design, includendo l’uso dell’Intelligenza Artificiale. La formazione, la ricerca e la correlata produzione sono finalizzate nell’ambito del variegato panorama delle pratiche contemporanee al ripensamento dello spazio sia pubblico che privato","codice_sector":"AFAM084","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"10-08-2026","ultimo_giorno_candidatura":"15-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9677/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/2411ba772b3444d194d825dd6d49697c","email_rup":"direttore@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2074","istituto":"ACCADEMIA DI BELLE ARTI DI CARRARA","discipline_nomi":"Tecniche artistiche della scultura","discipline_descrizione":"Il settore disciplinare comprende conoscenze, metodi e strumenti per sviluppare competenze multidisciplinari necessarie per un completo sviluppo professionale nel mondo della produzione artistica e industriale. Le applicazioni spaziano dalla realizzazione di opere alla progettazione e rappresentazione di manufatti artistici, includendo la sperimentazione in ambito pubblico e privato. Il settore comprende l’insieme dei saperi delle tecniche per la scultura, la fonderia, marmo e pietre dure, la lavorazione del legno e la saldatura, sviluppando una preparazione tecnica che copre sia le metodologie tradizionali che quelle moderne e contemporanee. L’attività di laboratorio è inscindibile dall’attività della ricerca progettuale, affrontata in una dimensione personale o nelle possibili relazioni interdisciplinari. I contenuti scientifico-disciplinari includono esperienze pratico-operative con materiali tradizionali e di nuova generazione utilizzati nella scultura contemporanea, approfondendo i procedimenti tecnici e le sollecitazioni percettive ed emotive che questi materiali possono originare. Attraverso la pratica si esplorano tecniche di lavorazione delle argille, costruzione di stampi, colatura e stratificazione di materiali, oltre a tecniche di brasatura e saldatura dei metalli. La lavorazione del legno copre tipologie, caratteristiche fisiche e meccaniche, strumenti, incastri, intarsio, assemblaggi e finitura per la creazione di opere tridimensionali. La brasatura e saldatura, compresa la modellazione, forniscono competenze pratico-operative per lavorazioni di strutture e opere scultoree complesse. Il percorso didattico interagisce con imprese creative e culturali, oltre che con istituzioni pubbliche e private operanti nel settore. Il settore delle tecniche del marmo comprende una conoscenza delle problematiche operative per la realizzazione di manufatti in materiale lapideo, sia dal punto di vista teorico, sia sul versante della pratica. La parte teorica si basa sullo studio dei materiali (marmi, graniti, basalti, pietre arenarie e calcaree), delle tecnologie e degli strumenti da utilizzare. La parte pratica assicura un processo completo di lavorazione. I contenuti scientifico-disciplinari delle tecniche per la scultura comprendono lo sviluppo di esperienze pratico operative. Si trattano sia i materiali della tradizione che di nuova generazione della scultura contemporanea, approfondendone la conoscenza Ciò anche per consentire un monitoraggio attento delle innumerevoli sollecitazioni percettive ed emotive che da tali materiali possono avere origine. Si approfondiscono, attraverso la pratica laboratoriale, le varie tecniche di lavorazione delle argille, le tecniche di costruzione di stampi (in gesso, vetro resina e con gomme siliconiche) il riempimento degli stampi attraverso la colatura e la stratificazione dei vari materiali (cemento, cere, polimeri termoplastici e termoindurenti). Inoltre si trattano le tecniche di brasatura e saldatura dei metalli compresa la modellazione. Le tecniche della lavorazione del legno abbracciano attività didattico-formative e di ricerca per fornire metodologie e strumenti sia tradizionali che tecnologici. Lo studente apprenderà la conoscenza delle varie tipologie di legno, gli strumenti per la lavorazione e gli incastri, l’intarsio, gli assemblaggi e la finitura. Le tecniche di fonderia racchiudono conoscenze delle differenti tecniche fusorie, della formatura e lo studio delle cere che, partendo dalle problematiche relative alla produzione di sculture e oggetti, individuano e risolvono gli snodi critici connessi alle tecniche di assemblaggio, all’uso vantaggioso dei materiali metallici nella scultura con strumenti per esplorare il rapporto spaziale della forma con l’ambiente, anche in dialogo con altre discipline","codice_sector":"AFAM082","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"10-08-2026","ultimo_giorno_candidatura":"15-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9674/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/ac0af7a23da748989dcc6ea9f43c613f","email_rup":"direttore@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2073","istituto":"ACCADEMIA DI BELLE ARTI DI CARRARA","discipline_nomi":"Arte del fumetto","discipline_descrizione":"I contenuti artistici disciplinari dell’illustrazione e del fumetto riguardano gli ambiti propri della comunicazione visiva attraverso i diversi linguaggi della narrazione per immagini. Il settore comprende teorie, tecniche, strumenti, competenze e ambiti di ricerca circa i metodi e i processi operativi impiegati per la progettazione e la realizzazione delle strutture narrative e discorsive proprie del fumetto e dell’illustrazione. I contenuti scientifici concernono lo statuto teorico e storico-critico dei prodotti – materiali e virtuali – e le forme proprie del pensiero progettuale come prassi interdisciplinare, e momento di sintesi dei molteplici saperi, nonché l’insieme dei linguaggi visivi, delle prassi artistiche e dei significati estetici e culturali che interagiscono con l’illustrazione e il fumetto. L’attività laboratoriale ha finalità tecnico-espressive che si realizzano attraverso le interconnesioni con altri linguaggi e le relazioni con le diverse tecniche grafiche, da quelle più tradizionali alle nuove tecnologie digitali, approfondendo tutte le fasi in cui si articola la creazione di un libro illustrato e di un volume a fumetti: dall’ideazione al soggetto, dallo storytellig alla sceneggiatura, dal character design alla definizione del layout e dello storyboard, dall’articolazione fra testo e immagine alla realizzazione e pubblicazione cartacea, digitale e per il web","codice_sector":"AFAM118","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"10-08-2026","ultimo_giorno_candidatura":"15-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9673/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/f9d3650288624dbabf63896de7a7bc9b","email_rup":"direttore@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2072","istituto":"ACCADEMIA DI BELLE ARTI DI CARRARA","discipline_nomi":"Pittura","discipline_descrizione":"I contenuti artistici del settore disciplinare comprendono le pratiche della pittura finalizzate alla conoscenza analitica e di sintesi delle complesse strutture spaziali/compositive/espressive che la costituiscono, organizzate in processi metodologici di sperimentazione e ricerca, alla luce delle specifiche individualità creative. Nella prassi è previsto sia l’utilizzo dei procedimenti della tradizione come l’affresco, sia la ricerca contemporanea volta alla produzione artistica, anche in una prospettiva metadisciplinare, in rapporto con gli altri campi del sapere e con gli sviluppi tecnologici più recenti. L’autonomia nelle scelte didattiche può tener conto anche delle peculiarità dei contesti territoriali, al fine di sviluppare al meglio le specificità artistiche nel contemporaneo. L’acquisizione della padronanza degli strumenti operativi sarà indispensabile al raggiungimento delle capacità espressive individuali. Fondamentale valore avrà la riflessione sull’operare artistico attraverso la progettualità, la scelta delle poetiche e dei linguaggi, l’analisi e la comparazione con gli esiti formali delle diverse tendenze di pensiero e di espressione in atto","codice_sector":"AFAM079","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"10-08-2026","ultimo_giorno_candidatura":"15-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9667/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/48bb1de9dcc54976a38685b930775f5b","email_rup":"direttore@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2071","istituto":"ACCADEMIA DI BELLE ARTI DI CARRARA","discipline_nomi":"Grafica d'arte","discipline_descrizione":"I contenuti artistici e tecnico scientifici del settore riguardano la ricerca e la sperimentazione dei linguaggi visivi e percettivi, l’analisi dei processi creativi e grafico espressivi nell’accezione metaforica, antropologica e simbolica delle molteplici forme della comunicazione e nell’interazione tra segno e messaggio. Il settore include competenze e ambiti di ricerca relativi alla lettura storica e contemporanea dei linguaggi visivi della grafica d’arte, agli aspetti che includono le tecniche e la tecnologia dei materiali, con particolare attenzione alla sostenibilità nonché lo studio del segno nella complessità tonale e semantica, fino ai processi artistico-tecnico-culturali della divulgazione e fruizione dell’immagine. La prassi laboratoriale si avvale della conoscenza metodologica di strumenti, mezzi, supporti e materiali tipici della stampa, a cominciare dalla carta e dagli inchiostri, dell’elaborazione delle matrici grafiche, dell’acquisizione della manualità delle tecniche calcografiche, xilografiche, litografiche e della stampa d’arte e della stampa manuale e digitale, dall’esemplare unico alla produzione seriale, fino alla sperimentazione delle più innovative pratiche tecnologiche e multimediali della contemporaneità, compresi gli aspetti tecnico-industriali, editoriali e di ricerca propri del processo divulgativo dell’immagine in ambito visivo","codice_sector":"AFAM076","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"10-08-2026","ultimo_giorno_candidatura":"15-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9664/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/f62829dcd24b4bde90710fc345ebd4b2","email_rup":"direttore@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2065","istituto":"CONSERVATORIO DI MUSICA DI CALTANISSETTA","discipline_nomi":"Violoncello","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM007","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"CALTANISSETTA","puoi_candidarsi_da":"08-08-2026","ultimo_giorno_candidatura":"15-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9740/download/BANDO","https://afam-anagrafiche.mur.gov.it/9646/download/BANDO","https://afam-anagrafiche.mur.gov.it/10127/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=4632258f31ce4612836401f2d8ba2ff5","email_rup":"direttoreamministrativo@istitutobellini.cl.it","telefono_rup":"093420078"},{"bando_id":"2064","istituto":"CONSERVATORIO DI MUSICA DI CALTANISSETTA","discipline_nomi":"Pratica pianistica e della lettura vocale e pianistica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’uso del pianoforte come nto fondamentale della formazione musicale dello strumentista. Si affrontano i repertori delle varie epoche fino ai nostri giorni, fornendo competenze legate alle metodologie di lettura estemporanea e alle tecniche di intonazione. Il settore concerne altresì l’interpretazione, lo studio delle tecniche e delle prassi della concertazione e della direzione d’orchestra, dal piccolo ensemble alla grande formazione comprendente anche compagini vocali e corali, fino al teatro musicale. La formazione del direttore d’orchestra comporta l’approfondimento della teoria e dell’analisi della musica nonché la conoscenza degli strumenti musicali, dei linguaggi, degli stili e della storia","codice_sector":"AFAM049","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"CALTANISSETTA","puoi_candidarsi_da":"08-08-2026","ultimo_giorno_candidatura":"15-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9642/download/BANDO","https://afam-anagrafiche.mur.gov.it/9732/download/BANDO","https://afam-anagrafiche.mur.gov.it/10119/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=dfb5d48d953c42c39d3be1964b4a6f15","email_rup":"direttoreamministrativo@istitutobellini.cl.it","telefono_rup":"093420078"},{"bando_id":"2056","istituto":"CONSERVATORIO DI MUSICA DI CALTANISSETTA","discipline_nomi":"Corno","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì compre zione, dell’arrangiamento e dell’improvvisazione. Relativamente agli sviluppi storico/stilistici del jazz e della popular music, saranno approfondite le competenze linguistiche e tecnico-espressive relative all’uso della voce e di ogni organico strumentale. L’orchestrazione e l’arrangiamento assumono aspetti particolari in tipologie di repertori in cui la funzione compositiva non è prescrittiva. Saranno promosse le competenze di concertazione e direzione musicale anche in esperienze di creazione istantanea e collettiva eterodiretta","codice_sector":"AFAM042","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"ROVIGO","puoi_candidarsi_da":"07-08-2026","ultimo_giorno_candidatura":"08-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9561/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=8fcb2f0769d64124894cb6bdf5aa8167","email_rup":"stefano.romani@docenti.consrovigo.it","telefono_rup":"042522273"},{"bando_id":"2003","istituto":"CONSERVATORIO DI MUSICA DI ROVIGO","discipline_nomi":"Tromba","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM015","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"ROVIGO","puoi_candidarsi_da":"07-08-2026","ultimo_giorno_candidatura":"08-0 CAMPOBASSO","discipline_nomi":"Accompagnamento pianistico","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle competenze tecniche, musicali, culturali ed interpretative finalizzate ad una piena conoscenza dei repertori dell’accompagnamento e della collaborazione pianistica, delle correlate prassi esecutive negli ambiti della musica vocale e strumentale dei diversi stili ed epoche, con particolare riferimento al teatro musicale. Prevede altresì l’approfondimento delle tecniche di lettura estemporanea e di trasposizione tonale, nonché la pratica e il trasferimento delle competenze proprie della figura del korrepetitor","codice_sector":"AFAM021","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"CAMPOBASSO","puoi_candidarsi_da":"07-08-2026","ultimo_giorno_candidatura":"08-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9514/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/194dc8a699b440f8b73ece4a3fe47624","email_rup":"amministrazione@conservatorioperosi.it","telefono_rup":"087490041"},{"bando_id":"1978","istituto":"CONSERVATORIO DI MUSICA DI BENEVENTO","discipline_nomi":"Composizione, arrangiamento e concertazione per i nuovi linguaggi musicali","discipline_descrizione":"Oggetto del settore sono gli aspetti compositivi e la relativa ricerca nell’ambito dei nuovi linguaggi musicali, comprendendo sia l’accezione della composizione originale, sia quella dell’elaborazione, della trascrizione, dell’arrangiamento e dell’improvvisazione. Relativamente agli sviluppi storico/stilistici del jazz e della popular music, saranno approfondite le competenze linguistiche e tecnico-espressive relative all’uso della voce e di ogni organico strumentale. L’orchestrazione e l’arrangiamento assumono aspetti particolari in tipologie di repertori in cui la funzione compositiva non è prescrittiva. Saranno promosse le competenze di concertazione e direzione musicale anche in esperienze di creazione istantanea e collettiva eterodiretta","codice_sector":"AFAM042","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"BENEVENTO","puoi_candidarsi_da":"07-08-2026","ultimo_giorno_candidatura":"07-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9515/download/BANDO","https://afam-anagrafiche.mur.gov.it/9516/download/BANDO","https://afam-anagrafiche.mur.gov.it/9513/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"e.cofrancesco@conservatorio.bn.it","telefono_rup":"0824 43222"},{"bando_id":"1964","istituto":"ACCADEMIA DI BELLE ARTI DI URBINO","discipline_nomi":"Tecniche per la pittura","discipline_descrizione":"Il settore disciplinare affronta la ricerca e le metodologie della pittura e le questioni tecniche inerenti le morfologie e le tipologie dei materiali e dei supporti utilizzati nelle diverse epoche. Rientra nelle competenze del settore lo studio e l’analisi dei materiali e dei colori, le indagini sui cambiamenti in atto nell’uso dei mezzi tecnici tradizionali, le ricerche sulle sperimentazioni anche relative all’uso dei nuovi media con i conseguenti adeguamenti sui linguaggi visivi","codice_sector":"AFAM080","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"URBINO","puoi_candidarsi_da":"06-08-2026","ultimo_giorno_candidatura":"10-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9502/download/BANDO","https://afam-anagrafiche.mur.gov.it/9501/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=05f00496e1eb4b4aaab26cc61cfc391e","email_rup":"protocollo@accademiadiurbino.it","telefono_rup":"0722320287"},{"bando_id":"1963","istituto":"ACCADEMIA DI BELLE ARTI DI URBINO","discipline_nomi":"Storia delle arti visive","discipline_descrizione":"Il settore comprende gli studi e le ricerche di carattere teorico, storico, metodologico negli ambiti della storia delle arti visive dall’antichità ai nostri giorni con particolare riferimento alla cultura occidentale per un’interpretazione critica delle manifestazioni artistiche dell’essere umano. La storia dell’arte è intesa elemento identitario della cultura in Italia e nell’ambito degli studi nel settore AFAM, nonché quale fattore necessario di consapevolezza civile sulla centralità del patrimonio artistico, la sua conservazione, tutela, valorizzazione e la sua trasmissione al futuro. Sono prese in esame con metodo interdisciplinare e nell’ottica della complessità le opere architettoniche, scultoree, pittoriche, grafiche fotografiche, installative e performative, con particolare attenzione agli agenti e ai fattori sociali che concorrono alla loro produzione nel contesto storico e culturale di appartenenza, nonché lo studio degli artisti, delle poetiche e dei movimenti artistici e il loro impatto sulla società. La disciplina studia le conseguenti modificazioni dei linguaggi anche in funzione dei cambiamenti delle tecniche e delle pratiche artistiche all’interno dell’orizzonte storico sociologico, estetico e culturale, dalle origini fino alle più attuali tendenze artistiche, non solo nelle tradizionali espressioni, ma anche con riferimento alle culture sceniche, coreografiche e filmiche, nonché in relazione alla produzione della società industriale e postindustriale, inclusa l’interazione e la contaminazione tra i nuovi e diversi linguaggi visivi, multimediali e con l’Intelligenza Artificiale. Include gli studi e le ricerche di iconografia e iconologia, di sociologia dell’arte, nonché quelli di carattere teorico e metodologico inerenti la critica d’arte, la letteratura artistica, la storia e la metodologia della storia dell’arte, la storia del collezionismo, la museologia, le relazioni tra le arti visive e le arti performative. Comprende infine gli studi le ricerche sulle tecniche artistiche, la storia e la teoria della conservazione e del restauro del patrimonio e le problematiche di conservazione dell’arte contemporanea","codice_sector":"AFAM102","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"URBINO","puoi_candidarsi_da":"06-08-2026","ultimo_giorno_candidatura":"10-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9499/download/BANDO","https://afam-anagrafiche.mur.gov.it/9500/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=8e2028fe21f845a49176207155330f74","email_rup":"protocollo@accademiadiurbino.it","telefono_rup":"0722320287"},{"bando_id":"1962","istituto":"ACCADEMIA DI BELLE ARTI DI URBINO","discipline_nomi":"Disegno e illustrazione","discipline_descrizione":"Il settore si articola in due ambiti: disegno e illustrazione. L’ambito del disegno comprende i contenuti artistici e scientifico-disciplinari e della ricerca che riguardano la formazione teorico-pratica e laboratoriale della cultura del disegno nell’accezione più ampia che comprende sia gli aspetti teorici che le indagini storiche sul disegno nei settori delle arti visive. Gli aspetti laboratoriali ed in particolare l’uso di strumenti e supporti legati tanto alle tecniche analogiche della tradizione quanto alle nuove tecnologie verranno considerati come finalità descrittive-progettuali ed espressive del disegno, visto come elemento di rappresentazione e come forma artistica autonoma ed applicata. I contenuti disciplinari dell’illustrazione riguardano gli ambiti propri della comunicazione visiva che utilizza la rappresentazione e la narrazione per immagini. Il settore comprende teorie, ricerche, metodi, tecniche e saperi impiegati per la progettazione e realizzazione di strutture narrative e discorsive visive. Le componenti tecniche e culturali offerte sono volte al raggiungimento di finalità eterogenee. L’attività teorico-pratica e laboratoriale ha finalità tecnico-espressive realizzate attraverso interconnessioni con altri linguaggi e relazioni con diverse tecniche grafiche, da quelle tradizionali alle nuove tecnologie digitali in tutte le declinazioni possibili dell’illustrazione (naturalistica, del libro d’arte e per l’infanzia) fino all’Intelligenza Artificiale","codice_sector":"AFAM077","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"URBINO","puoi_candidarsi_da":"06-08-2026","ultimo_giorno_candidatura":"10-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9498/download/BANDO","https://afam-anagrafiche.mur.gov.it/9497/download/BANDO","https://afam-anagrafiche.mur.gov.it/9496/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=7b8eee6c84204f2f90418fd067b64281","email_rup":"protocollo@accademiadiurbino.it","telefono_rup":"0722320287"},{"bando_id":"1961","istituto":"ACCADEMIA DI BELLE ARTI DI URBINO","discipline_nomi":"Metodi e strumenti per la rappresentazione del progetto","discipline_descrizione":"Il settore disciplinare si fonda sull’assunto culturale che la rappresentazione sia un’estensione del pensiero e un linguaggio universalmente riconosciuto di comunicazione. L’attività di ricerca, progettuale, artistica e didattico-formativa, sia teorica sia pratica, comprende l’insieme dei saperi, delle teorie, dei metodi e delle tecniche per la produzione di rappresentazioni bidimensionali e tridimensionali, sia analogiche sia digitali sia post-digitali, relative alle attività di ideazione alle diverse scale, dello spazio, del manufatto e dell’oggetto, sia reali sia immaginate, compresi i beni culturali","codice_sector":"AFAM083","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"URBINO","puoi_candidarsi_da":"06-08-2026","ultimo_giorno_candidatura":"10-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9493/download/BANDO","https://afam-anagrafiche.mur.gov.it/9494/download/BANDO","https://afam-anagrafiche.mur.gov.it/9495/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=abb7e1bc38c645828b2ff3908acd1fb8","email_rup":"protocollo@accademiadiurbino.it","telefono_rup":"0722320287"},{"bando_id":"1960","istituto":"ACCADEMIA DI BELLE ARTI DI URBINO","discipline_nomi":"Teoria, storia e metodo dei mass media","discipline_descrizione":"Teoria, storia e metodo dei mass media è un settore che si concentra sulle forme, le strategie e le tecnologie che caratterizzano le comunicazioni di massa, con un’attenzione specifica al loro impatto socio-culturale. Il settore definisce la fenomenologia dei media nel loro rapporto con i linguaggi artistici e i loro mutamenti sia nel contesto comunicativo sia in quello espressivo. Sono ambiti di ricerca della disciplina la teoria dei media e l’analisi delle strutture linguistiche e comunicazionali connesse all’evoluzione dei mass media. All’interno della storia sociale le comunicazioni di massa hanno svolto un importante ruolo di mediazione, veicolando contenuti simbolici e contribuendo ai processi di costruzione dell’identità culturale e sociale. Nell’attuale società digitale e iperconnessa, i media svolgono un ruolo centrale in tutte le interazioni sociali e pervadono la gran parte delle attività culturali: dalla comunicazione all’educazione, dall’intrattenimento alle pratiche artistiche. Pertanto, vista l’ampiezza degli ambiti di interesse, la metodologia adottata è interdisciplinare e fa dialogare lo studio dei linguaggi multimediali, audiovisivi e digital con l’analisi sociologica dei processi comunicativi, la storia culturale e la cultura visuale","codice_sector":"AFAM119","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"URBINO","puoi_candidarsi_da":"06-08-2026","ultimo_giorno_candidatura":"09-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9491/download/BANDO","https://afam-anagrafiche.mur.gov.it/9490/download/BANDO","https://afam-anagrafiche.mur.gov.it/9492/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=e17a5214d8634624b98249dbe591f38a","email_rup":"protocollo@accademiadiurbino.it","telefono_rup":"0722320287"},{"bando_id":"1949","istituto":"CONSERVATORIO DI MUSICA CESENA - RIMINI","discipline_nomi":"Scienze del suono per la musica","discipline_descrizione":"Il settore delle Scienze del suono per la musica integra diversi ambiti della ricerca artistica e scientifica e le relative applicazioni nella musica elettronica. Tali ambiti sono correlati ad alcuni campi della fisica acustica, dell’analisi numerica, dell’informatica, del design dell’interazione, oltre che della psicologia sperimentale, con riferimento alla cornice disciplinare del Sound and Music Computing. Più nello specifico essi riguardano i fondamenti dell’acustica degli ambienti e degli strumenti musicali, nonché l’ecologia acustica; i modelli di sintesi ed elaborazione del segnale sonoro; l’analisi e la rappresentazione dell’informazione sonora e musicale (inclusa quella simbolica delle diverse forme di notazione musicale); i linguaggi di programmazione, inclusivi delle librerie utili alla produzione di algoritmi per la musica elettroacustica, mista e per i sistemi interattivi, così come i vari applicativi dell’industria musicale; il design del suono per l’interazione; gli elementi della fisiologia e della psicologia della percezione e cognizione uditiva e multimodale","codice_sector":"AFAM046","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"MUSICA CESENA - RIMINI","puoi_candidarsi_da":"06-08-2026","ultimo_giorno_candidatura":"07-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9521/download/BANDO","https://afam-anagrafiche.mur.gov.it/9469/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"protocollo@madernalettimi.it","telefono_rup":"054728679"},{"bando_id":"1947","istituto":"CONSERVATORIO DI MUSICA CESENA - RIMINI","discipline_nomi":"Strumenti a percussione per i nuovi linguaggi musicali","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche rup":"0444 507551"},{"bando_id":"1933","istituto":"CONSERVATORIO DI MUSICA DI VICENZA","discipline_nomi":"Musicologia e storia della musica","discipline_descrizione":"Il settore comprende le attività didattiche e di ricerca relative alla musicologia, alla storia della musica e dei linguaggi musicali, dal mondo antico all’età contemporanea, al teatro musicale, affrontate secondo diversi approcci metodologici: storico-filologico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-testo poetico e la drammaturgia musicale. Gli ambiti di competenza del settore sono trattati sia distintamente, sia in relazione reciproca, sia in rapporto alle discipline artistiche, teatrali, cinematografiche, coreutiche e umanistiche, sia in prospettiva di tutela e valorizzazione del patrimonio musicale materiale e immateriale. Il settore concerne infine lo studio della didattica della storia della musica con riferimento all’applicazione in ambito formativo ed educativo","codice_sector":"AFAM040","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"VICENZA","puoi_candidarsi_da":"19-08-2026","ultimo_giorno_candidatura":"18-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9795/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"conservatoriovicenza@consvi.it","telefono_rup":"0444 507551"},{"bando_id":"1928","istituto":"CONSERVATORIO DI MUSICA DI VICENZA","discipline_nomi":"Canto per i nuovi linguaggi musicali","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica del canto e conoscenze di base della fisiologia dell’apparato vocale e delle componenti psicologiche che contribuiscono alla formazione del suono","codice_sector":"AFAM032","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"VICENZA","puoi_candidarsi_da":"07-08-2026","ultimo_giorno_candidatura":"13-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9445/download/BANDO","https://afam-anagrafiche.mur.gov.it/9697/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"conservatoriovicenza@consvi.it","telefono_rup":"0444 507551"},{"bando_id":"1926","istituto":"CONSERVATORIO DI MUSICA DI VICENZA","discipline_nomi":"Basso tuba","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento e agli eventuali strumenti affini, necessarie per affrontare, con piena consapevolezza delle correlate prassi esecutive, i diversi repertori delle varie epoche fino ai nostri giorni. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM008","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"VICENZA","puoi_candidarsi_da":"07-08-2026","ultimo_giorno_candidatura":"13-09-2026","allegati":["https://afam-anagrafiche.mur.gov tive, accanto a connesse acquisizioni storiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica del canto e conoscenze di base della fisiologia dell’apparato vocale e delle componenti psicologiche che contribuiscono alla formazione del suono","codice_sector":"AFAM032","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"LUCCA","puoi_candidarsi_da":"03-08-2026","ultimo_giorno_candidatura":"09-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9563/download/BANDO","https://afam-anagrafiche.mur.gov.it/9266/download/BANDO","https://afam-anagrafiche.mur.gov.it/9564/download/BANDO","https://afam-anagrafiche.mur.gov.it/9562/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/?text=&categoriaId=&regioneId=&status=&settoreId=&periodo=&ral=&ente=boccherini&page_num=0","email_rup":"direzione@boccherini.it","telefono_rup":"0583464104"},{"bando_id":"1749","istituto":"CONSERVATORIO DI MUSICA DI VIBO VALENTIA","discipline_nomi":"Teoria e tecnica dell'interpretazione scenica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, si occupa delle relazioni fra scena e musica e, in particolare, dello studio della recitazione, della dizione, della gestualità e degli aspetti concernenti la regia e i costumi, con particolare riferimento al teatro musicale e ad altre forme di spettacolo. Si approfondisce anche l’indagine concernente l’analisi del personaggio attraverso il metodo dell’interpretazione","codice_sector":"AFAM055","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"VIBO VALENTIA","puoi_candidarsi_da":"31-07-2026","ultimo_giorno_candidatura":"09-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9663/download/BANDO","https://afam-anagrafiche.mur.gov.it/9099/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/3171b03fb74249cd93b0c52669ee82f4","email_rup":"f.ilario@consvv.it","telefono_rup":"0963-375235"},{"bando_id":"1715","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"29-07-2026","ultimo_giorno_candidatura":"10-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9021/download/BANDO","https://afam-anagrafiche.mur.gov.it/9025/download/BANDO","https://afam-anagrafiche.mur.gov.it/9023/download/BANDO","https://afam-anagrafiche.mur.gov.it/9024/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/4e88138fab9040ac81b2877d56d197db","email_rup":"pec@pec.accademiabelleartiverona.it","telefono_rup":"0458000082"},{"bando_id":"1710","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","discipline_nomi":"Tecniche artistiche della scultura","discipline_descrizione":"Il settore disciplinare comprende conoscenze, metodi e strumenti per sviluppare competenze multidisciplinari necessarie per un completo sviluppo professionale nel mondo della produzione artistica e industriale. Le applicazioni spaziano dalla realizzazione di opere alla progettazione e rappresentazione di manufatti artistici, includendo la sperimentazione in ambito pubblico e privato. Il settore comprende l’insieme dei saperi delle tecniche per la scultura, la fonderia, marmo e pietre dure, la lavorazione del legno e la saldatura, sviluppando una preparazione tecnica che copre sia le metodologie tradizionali che quelle moderne e contemporanee. L’attività di laboratorio è inscindibile dall’attività della ricerca progettuale, affrontata in una dimensione personale o nelle possibili relazioni interdisciplinari. I contenuti scientifico-disciplinari includono esperienze pratico-operative con materiali tradizionali e di nuova generazione utilizzati nella scultura contemporanea, approfondendo i procedimenti tecnici e le sollecitazioni percettive ed emotive che questi materiali possono originare. Attraverso la pratica si esplorano tecniche di lavorazione delle argille, costruzione di stampi, colatura e stratificazione di materiali, oltre a tecniche di brasatura e saldatura dei metalli. La lavorazione del legno copre tipologie, caratteristiche fisiche e meccaniche, strumenti, incastri, intarsio, assemblaggi e finitura per la creazione di opere tridimensionali. La brasatura e saldatura, compresa la modellazione, forniscono competenze pratico-operative per lavorazioni di strutture e opere scultoree complesse. Il percorso didattico interagisce con imprese creative e culturali, oltre che con istituzioni pubbliche e private operanti nel settore. Il settore delle tecniche del marmo comprende una conoscenza delle problematiche operative per la realizzazione di manufatti in materiale lapideo, sia dal punto di vista teorico, sia sul versante della pratica. La parte teorica si basa sullo studio dei materiali (marmi, graniti, basalti, pietre arenarie e calcaree), delle tecnologie e degli strumenti da utilizzare. La parte pratica assicura un processo completo di lavorazione. I contenuti scientifico-disciplinari delle tecniche per la scultura comprendono lo sviluppo di esperienze pratico operative. Si trattano sia i materiali della tradizione che di nuova generazione della scultura contemporanea, approfondendone la conoscenza Ciò anche per consentire un monitoraggio attento delle innumerevoli sollecitazioni percettive ed emotive che da tali materiali possono avere origine. Si approfondiscono, attraverso la pratica laboratoriale, le varie tecniche di lavorazione delle argille, le tecniche di costruzione di stampi (in gesso, vetro resina e con gomme siliconiche) il riempimento degli stampi attraverso la colatura e la stratificazione dei vari materiali (cemento, cere, polimeri termoplastici e termoindurenti). Inoltre si trattano le tecniche di brasatura e saldatura dei metalli compresa la modellazione. Le tecniche della lavorazione del legno abbracciano attività didattico-formative e di ricerca per fornire metodologie e strumenti sia tradizionali che tecnologici. Lo studente apprenderà la conoscenza delle varie tipologie di legno, gli strumenti per la lavorazione e gli incastri, l’intarsio, gli assemblaggi e la finitura. Le tecniche di fonderia racchiudono conoscenze delle differenti tecniche fusorie, della formatura e lo studio delle cere che, partendo dalle problematiche relative alla produzione di sculture e oggetti, individuano e risolvono gli snodi critici connessi alle tecniche di assemblaggio, all’uso vantaggioso dei materiali metallici nella scultura con strumenti per esplorare il rapporto spaziale della forma con l’ambiente, anche in dialogo con altre discipline","codice_sector":"AFAM082","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"29-07-2026","ultimo_giorno_candidatura":"10-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9014/download/BANDO","https://afam-anagrafiche.mur.gov.it/9015/download/BANDO","https://afam-anagrafiche.mur.gov.it/9016/download/BANDO","https://afam-anagrafiche.mur.gov.it/9013/download/BANDO","https://afam-anagrafiche.mur.gov.it/9867/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/f547cf689ba94feeaa8a3bc661dd2e68","email_rup":"pec@pec.accademiabelleartiverona.it","telefono_rup":"0458000082"},{"bando_id":"1707","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","discipline_nomi":"Scenografia","discipline_descrizione":"I contenuti del settore fanno riferimento ai diversi ambiti di competenza della ricerca e della progettazione scenografica e scenotecnica per il teatro, il teatro di figura, il cinema, la televisione e i nuovi media. Si contemplano le connessioni con le tecniche e tecnologie della tradizione e del contemporaneo, incluse le modalità di restituzione grafica, pittorica, plastica e la rappresentazione esecutiva dello spazio scenico. I contenuti disciplinari comprendono: la progettazione per il teatro (dalla prosa al teatro musicale alle sperimentazioni drammaturgiche, musicali e coreutiche in spazi tradizionali, urbani e di nuova concezione); la progettazione dello spazio per eventi e allestimenti; la progettazione dello spazio scenico, performativo e coreutico; le tecniche di realizzazione per il teatro di figura; la scenografia del cinema comprese le tecnologie per la creazione di ambienti ed architetture virtuali per la produzione filmica, seriale, documentaristica e di sperimentazione; per la televisione di palinsesto, di divulgazione ed intratt
