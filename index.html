<head>

  <title>POSIZIONI AFAM</title>

  <style>
:root {
  --sfondo: #FCFDFD;
  --accento: #0066CC;
  --accento-2: #FF0000;
  --contrasto: #000000;
  --neutro-1: #E8E8E8;
  --neutro-2: #525252;
  --font-size: 20px;
  --font-size-mobile: 14px;
  --testo: lowercase;
  --weight-1: 420;
  --weight-2: 570;
  --weight-3: 720;
  --raggio-bottoni: 10px;
  --raggio-card: 30px;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  text-transform: var(--testo);
  background: var(--sfondo);
  color: var(--accento);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  font-size: var(--font-size);
  background: var(--sfondo);
  text-transform: var(--testo);
  padding: 10px 10px;
  border-bottom: 2px solid var(--neutro-1);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header-testo {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.br-mobile {
  display: none;
}

header h1 {
  font-size: var(--font-size);
  font-weight: var(--weight-3);
  text-transform: var(--testo);
  letter-spacing: 0;
  white-space: nowrap;
}

.header-sottotitolo {
  font-weight: var(--weight-1);
  color: var(--accento);
  margin-top: 0;
  margin-left: auto;
  letter-spacing: 0;
  white-space: nowrap;
}

.header-conteggio {
  display: none;
}

main {
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);

  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#filtri {
  width: 33.333%;
  min-width: 33.333%;
  overflow-y: auto;
  padding: 20px;
  border-right: 2px solid var(--neutro-1);
  background: var(--sfondo);
}

#offerte {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.filtro-categoria {
  margin-bottom: 14px;
}

.filtro-titolo {
  color: var(--accento);
  letter-spacing: 0;
  margin-bottom: 10px;
}

.filtro-bottoni {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filtro-bottone {
  font-size: var(--font-size);
  font-weight: var(--weight-1);
  background: var(--neutro-1);
  color: var(--neutro-2);
  text-transform: var(--testo);
  border: 1px solid transparent;
  border-radius: var(--raggio-bottoni);
  padding: 1px 7px;
  font-family: 'Titillium Web', sans-serif;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filtro-bottone:hover {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-bottone.attivo {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-bottone.attivo.azzerato {
  background: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown {
  position: relative;
}

.filtro-dropdown-trigger {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 0;
  transition: all 0.15s ease;
}

.filtro-dropdown-trigger:hover,
.filtro-dropdown-trigger.ha-filtri,
.filtro-dropdown-trigger.aperto {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-dropdown-trigger.ha-azzerati {
  background: var(--accento-2);
  border-color: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown-toggle {
  line-height: 1;
}

.filtro-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--sfondo);
  border: 0px solid var(--neutro-2);
  z-index: 200;
  padding: 6px;
}

.filtro-dropdown-menu.aperto {
  display: block;
  position: static;
  margin-top: 6px;
  width: 100%;
}

.filtro-dropdown-menu::-webkit-scrollbar {
  width: 6px;
}

.filtro-dropdown-menu::-webkit-scrollbar-thumb {
  background: var(--neutro-2);
}

.filtro-dropdown-menu .filtro-codice-toggle {
  margin-top: 6px;
  margin-bottom: 6px;
}

.filtro-reset {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  margin-top: 7px;
  transition: all 0.15s ease;
}

.filtro-reset:hover {
  background: var(--accento);
  color: var(--sfondo);
}

.lista-offerte {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 900px) {
  .lista-offerte {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 20px;
  position: relative;
  transition: border-color 0.15s ease;
  min-width: 0;
  overflow-wrap: break-word;
}

.card:hover {
  border-color: var(--accento);
}

.card-disciplina {
  font-weight: var(--weight-3);
  color:  var(--accento);
  line-height: 1.1;
  margin-bottom: 3px;
}

.card-info-icon {
  position: absolute;
  top: 20px;
  right: 20px;
  color: var(--accento);
  cursor: pointer;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  height: 1em;
}

.card .tooltip {
  display: none;
  position: absolute;
  top: 34px;
  right: 20px;
  width: calc(100% - 40px);
  background: var(--neutro-1);
  color: var(--contrasto);
  border: 1px solid var(--contrasto);
  padding: 12px;
  font-weight: var(--weight-1);
  line-height: 1.15;
  z-index: 1000;
  white-space: normal;
}

.card:has(.card-info-icon:hover) .tooltip,
.card:has(.tooltip:hover) .tooltip {
  display: block;
    color: var(--neutro-2);
}

.card-campo {
  font-weight: var(--weight-2);
  margin-bottom: 3px;
  line-height: 1.4;
}

.card-valore-puro {
  color: var(--contrasto);
}

.card-etichetta {
  color: var(--neutro-2);
  font-weight: 400;

}

.card-valore {
  color: var(--contrasto);
}

.card-id,
.card-id:visited {
  color: var(--accento);
  text-decoration: none;
}

.card-id:hover {
  color: var(--accento);
  text-decoration: none;
}

.card.offerta-scaduta,
.card.offerta-scaduta .card-disciplina,
.card.offerta-scaduta .card-valore-puro,
.card.offerta-scaduta .card-valore,
.card.offerta-scaduta .card-etichetta,
.card.offerta-scaduta .card-id,
.card.offerta-scaduta .card-id:visited {
  color: var(--neutro-1);
}

.card.offerta-scaduta .card-info-icon {
  color: var(--neutro-1);
}

.card.offerta-scaduta:hover {
  border-color: var(--neutro-1);
}

#filtri::-webkit-scrollbar,
#offerte::-webkit-scrollbar {
  width: 6px;
}

#filtri::-webkit-scrollbar-track,
#offerte::-webkit-scrollbar-track {
  background: transparent;
}

#filtri::-webkit-scrollbar-thumb,
#offerte::-webkit-scrollbar-thumb {
  background: var(--neutro-1);
}

@media (max-width: 768px) {
  :root {
    --font-size: var(--font-size-mobile);
  }

  body {
    height: auto;
    overflow: visible;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 300;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 16px;
    row-gap: 0;
    align-items: start;
  }

  .header-testo {
    display: contents;
  }

  header h1 {
    grid-column: 1;
    grid-row: 1 / 3;
    white-space: normal;
    align-self: start;
    line-height: 1;
  }

  .header-sottotitolo {
    grid-column: 2;
    grid-row: 1 / 3;
    justify-self: end;
    align-self: start;
    margin-left: 0;
    white-space: normal;
    text-align: right;
    line-height: 1;
  }

  .br-mobile {
    display: block;
  }

  .hyphen {
    display: none;
  }

  main {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }

  #filtri {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--neutro-1);
    overflow-x: auto;
    display: none;
  }

  #filtri.aperto {
    display: block;
  }

  .card .tooltip,
  .card-info-icon {
    display: none;
  }

  .filtro-bottoni {
    flex-wrap: nowrap;
  }

  .filtro-dropdown-menu .filtro-bottoni {
    flex-wrap: wrap;
  }

  .filtro-dropdown-menu .filtro-bottone {
    flex: 0 1 auto;
  }

  .filtro-bottone-luogo {
    white-space: nowrap;
  }

  .filtro-bottone-disciplina {
    white-space: normal;
    overflow-wrap: break-word;
  }

  .filtro-bottone {
    line-height: 1;
  }

  .filtro-dropdown-trigger {
    line-height: 1;
  }

  .filtro-reset {
    line-height: 1;
  }

  .filtri-toggle {
    background: transparent;
    color: var(--accento);
    border: 2px solid var(--accento);
    border-radius: var(--raggio-bottoni);
    padding: 6px 10px;
    font-family: 'Titillium Web', sans-serif;
    font-size: var(--font-size);
    font-weight: var(--weight-2);
    text-transform: var(--testo);
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filtri-toggle.ha-filtri {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtri-toggle.ha-azzerati {
    background: var(--accento-2);
    border-color: var(--accento-2);
    color: var(--sfondo);
  }

  .filtro-dropdown-menu .filtro-codice-toggle {
    display: none;
  }

  .header-conteggio {
    display: block;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: calc(var(--font-size) * 1.5);
    font-weight: var(--weight-3);
    line-height: 1;
    color: var(--contrasto);
  }

  .offerte-bar .offerte-conteggio {
    display: none;
  }

  #offerte {
    overflow: visible;
  }

  .card {
    padding: 14px;
  }
}
  </style>

tive coding), alla progettazione, sviluppo e gestione di prodotti per la comunicazione mediante protocolli Internet (web/mobile programming), alla progettazione e realizzazione di dispositivi capaci di interagire con l’ambiente, in particolare mediante tecniche di sensoristica, microelettronica e robotica (physical computing), alle applicazioni delle tecniche e degli strumenti nell’ambito dell’Intelligenza Artificiale, nonché alla riflessione di carattere filosofico attorno alle tecnologie","codice_sector":"AFAM095","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"REGGIO CALABRIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"07-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10232/download/BANDO"],"bando_inpa":"https://ww2.gazzettaamministrativa.it/opencms/opencms/_gazzetta_amministrativa/amministrazione_trasparente/_calabria/_accademia_di_belle_arti_di_reggio_calabria/050_ban_con/2026/0008_Documenti_1788761303513/","email_rup":"direttore@abarc.it","telefono_rup":"0965499415"},{"bando_id":"2264","istituto":"ACCADEMIA DI BELLE ARTI DI REGGIO CALABRIA","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"REGGIO CALABRIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"07-10-2026","allegati":[],"bando_inpa":"https://ww2.gazzettaamministrativa.it/opencms/opencms/_gazzetta_amministrativa/amministrazione_trasparente/_calabria/_accademia_di_belle_arti_di_reggio_calabria/050_ban_con/2026/0007_Documenti_1788759734844/","email_rup":"direttore@abarc.it","telefono_rup":"0965499415"},{"bando_id":"2263","istituto":"ACCADEMIA DI BELLE ARTI DI MILANO","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"MILANO","puoi_candidarsi_da":"04-09-2026","ultimo_giorno_candidatura":"04-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10225/download/BANDO","https://afam-anagrafiche.mur.gov.it/10226/download/BANDO"],"bando_inpa":"","email_rup":"direzioneamministrativa@accademiadibrera.milano.it","telefono_rup":"0286955264"},{"bando_id":"2262","istituto":"CONSERVATORIO DI MUSICA DI FOGGIA","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"FOGGIA","puoi_candidarsi_da":"03-09-2026","ultimo_giorno_candidatura":"05-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10221/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/086edb7f53ef42d08b82f21d04a87012","email_rup":"d.amministrativa@conservatoriofoggia.it","telefono_rup": ico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-testo poetico e la drammaturgia musicale. Gli ambiti di competenza del settore sono trattati sia distintamente, sia in relazione reciproca, sia in rapporto alle discipline artistiche, teatrali, cinematografiche, coreutiche e umanistiche, sia in prospettiva di tutela e valorizzazione del patrimonio musicale materiale e immateriale. Il settore concerne infine lo studio della didattica della storia della musica con riferimento all’applicazione in ambito formativo ed educativo","codice_sector":"AFAM040","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"BRESCIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"08-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10151/download/BANDO"],"bando_inpa":"https://www.consbs.it/albo_pretorio/procedura-comparativa-per-il-conferimento-di-incarichi-a-docenti-esterni-con-contratti-di-collaborazione-inerenti-materie-di-insegnamento-non-in-organico-a-a-2026-2027-sede-di-brescia-e-di-darfo-bo-5/","email_rup":"conservatoriomarenzio@pec.it","telefono_rup":"0302886711"},{"bando_id":"2243","istituto":"CONSERVATORIO DI MUSICA DI BRESCIA","discipline_nomi":"Lettura della partitura","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’uso del pianoforte come strumento conoscitivo dell’intera letteratura musicale. In particolare viene sviluppata la capacità della lettura della partitura, dai piccoli complessi cameristici alla grande orchestra. Comprende inoltre le tecniche di trasporto e di riduzione pianistica da qualunque organico","codice_sector":"AFAM050","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"BRESCIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"08-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10150/download/BANDO"],"bando_inpa":"https://www.consbs.it/albo_pretorio/procedura-comparativa-per-il-conferimento-di-incarichi-a-docenti-esterni-con-contratti-di-collaborazione-inerenti-materie-di-insegnamento-non-in-organico-a-a-2026-2027-sede-di-brescia-e-di-darfo-bo-4/","email_rup":"conservatoriomarenzio@pec.it","telefono_rup":"0302886711"},{"bando_id":"2242","istituto":"CONSERVATORIO DI MUSICA DI BRESCIA","discipline_nomi":"Musica d'insieme per voci e strumenti storici","discipline_descrizione":"Il settore concerne lo studio, la ricerca, la pratica e l’interpretazione della musica d’insieme con voci e strumenti storici. Tale studio serve da punto di raccordo interdisciplinare tra le prassi esecutive strumentali e vocali e la pratica del basso continuo. Lo scopo è la conoscenza e l’approfondimento, oltre che delle tecniche, della letteratura, dei vari stili e dei sistemi di temperamento in uso. Per il raggiungimento di tali obiettivi la pratica strumentale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione e alla gestualità, prevedendo tutti i possibili organici presenti nella letteratura, dalle piccole formazioni da camera ai grandi insiemi","codice_sector":"AFAM038","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"BRESCIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"08-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10149/download/BANDO"],"bando_inpa":"https://www.consbs.it/albo_pretorio/procedura-comparativa-per-il-conferimento-di-incarichi-a-docenti-esterni-con-contratti-di-collaborazione-inerenti-materie-di-insegnamento-non-in-organico-a-a-2026-2027-sede-di-brescia-e-di-darfo-bo-3/","email_rup":"conservatoriomarenzio@pec.it","telefono_rup":"0302886711"},{"bando_id":"2240","istituto":"CONSERVATORIO DI MUSICA DI BRESCIA","discipline_nomi":"Strumenti a corde per i nuovi linguaggi musicali","discipline_descrizione":"per i nuovi linguaggi musicali Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM028","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"BRESCIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"08-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10147/download/BANDO"],"bando_inpa":"https://www.consbs.it/albo_pretorio/procedura-comparativa-per-il-conferimento-di-incarichi-a-docenti-esterni-con-contratti-di-collaborazione-inerenti-materie-di-insegnamento-non-in-organico-a-a-2026-2027-sede-di-brescia-e-di-darfo-bo-2/","email_rup":"conservatoriomarenzio@pec.it","telefono_rup":"0302886711"},{"bando_id":"2239","istituto":"CONSERVATORIO DI MUSICA DI BRESCIA","discipline_nomi":"Canto per i nuovi linguaggi musicali","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica del canto e conoscenze di base della fisiologia dell’apparato vocale e delle componenti psicologiche che contribuiscono alla formazione del suono","codice_sector":"AFAM032","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"BRESCIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"08-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10146/download/BANDO"],"bando_inpa":"https://www.consbs.it/albo_pretorio/procedura-comparativa-per-il-conferimento-di-incarichi-a-docenti-esterni-con-contratti-di-collaborazione-inerenti-materie-di-insegnamento-non-in-organico-a-a-2026-2027-sede-di-brescia-e-di-darfo-bo/","email_rup":"conservatoriomarenzio@pec.it","telefono_rup":"0302886711"},{"bando_id":"2236","istituto":"CONSERVATORIO DI MUSICA D'AVELLINO","discipline_nomi":"Corno","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM010","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"MUSICA D'AVELLINO","puoi_candidarsi_da":"03-09-2026","ultimo_giorno_candidatura":"18-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10125/download/BAN ,"tipo_scuola":"Conservatorio","dove":"BOLOGNA","puoi_candidarsi_da":"03-09-2026","ultimo_giorno_candidatura":"17-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10081/download/BANDO"],"bando_inpa":"http://www.inpa.gov.it","email_rup":"bandiecontratti@consbo.it","telefono_rup":"051 221483"},{"bando_id":"2221","istituto":"CONSERVATORIO DI MUSICA DI BOLOGNA","discipline_nomi":"Composizione","discipline_descrizione":"Il settore concerne la ricerca e lo studio dei processi creativi-compositivi (composizione originale, elaborazione, trascrizione, arrangiamento), nei vari generi e linguaggi musicali, storici e caratteristici della contemporaneità, compresa la composizione applicata alle immagini. In particolare il settore mira a sviluppare, attraverso l’analisi e l’esercizio compositivo nelle diverse formazioni strumentali e vocali, le competenze storicostilistiche e linguistiche in campo melodico, ritmico, armonico, contrappuntistico, timbrico, nonché le competenze tecnicoespressive relative all’uso della voce. Fondamentale aspetto di questo settore è lo studio delle forme compositive e delle tecniche della comunicazione musicale. Il settore concerne inoltre la didattica della composizione, con specifico riferimento all’applicazione in ambito formativo-educativo, in contesti scolastici ed extrascolastici","codice_sector":"AFAM041","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"BOLOGNA","puoi_candidarsi_da":"03-09-2026","ultimo_giorno_candidatura":"17-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10078/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/ca12159d199b479ba45d1a671989a97c","email_rup":"bandiecontratti@consbo.it","telefono_rup":"051 221483"},{"bando_id":"2220","istituto":"CONSERVATORIO DI MUSICA DI COMO","discipline_nomi":"Pratica pianistica e della lettura vocale e pianistica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’uso de },{"bando_id":"2180","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","discipline_nomi":"Musica liturgica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, comprende gli studi relativi al repertorio musicale liturgico, con particolare riferimento a quello della tradizione cattolica. Concerne pertanto l’acquisizione delle competenze e delle abilità necessarie per svolgere l’attività di direttore di ensemble vocali e strumentali e delle conoscenze di carattere storico e rituale. Il settore concerne altresì l’acquisizione delle abilità tecniche e delle competenze interpretative inerenti l’impiego liturgico dell’organo, unitamente alle conoscenze relative al canto cristiano medievale e ai linguaggi modali","codice_sector":"AFAM039","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"29-08-2026","ultimo_giorno_candidatura":"28-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9943/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/fbd190167d5f4f1ea5a295b5bbc3e042","email_rup":"personale.timpano@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2179","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","discipline_nomi":"Musica da camera strumentale e vocale","discipline_descrizione":"Il settore concerne lo studio, la ricerca, la pratica e l’interpretazione della letteratura cameristica strumentale e vocale, con l’approfondimento delle prassi esecutive e i repertori di varie epoche, anche con riferimento all’interpretazione del repertorio vocale da camera e liederistico","codice_sector":"AFAM034","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"29-08-2026","ultimo_giorno_candidatura":"28-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9919/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/98bcce9924ea42cb99099043d06e8296","email_rup":"personale.timpano@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2176","istituto":"CONSERVATORIO DI MUSICA DI REGGIO EMILIA","discipline_nomi":"Orchestra","discipline_descrizione":"Il settore concerne la formazione orchestrale, nella quale l’attenzione riguarda la ricerca, l’esercizio della pratica e dell’interpretazione orchestrale, vista come elemento fondamentale della formazione musicale dello strumentista. Si affrontano i repertori delle varie epoche fino ai nostri giorni, fornendo competenze legate alle metodologie di lettura estemporanea e alle tecniche di intonazione. Il settore concerne altresì l’interpretazione, lo studio delle tecniche e delle prassi della concertazione e della direzione d’orchestra, dal piccolo ensemble alla grande formazione comprendente anche compagini vocali e corali, fino al teatro musicale. La formazione del direttore d’orchestra comporta l’approfondimento della teoria e dell’analisi della musica nonché la conoscenza degli strumenti musicali, dei linguaggi, degli stili e della storia","codice_sector":"AFAM049","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"REGGIO EMILIA","puoi_candidarsi_da":"28-08-2026","ultimo_giorno_candidatura":"27-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10130/download/BANDO","https://afam-anagrafiche.mur.gov.it/10104/download/BANDO","https://afam-anagrafiche.mur.gov.it/9911/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it","email_rup":"maria.elena.mazzanti@conservatorio.peri-merulo.it","telefono_rup":"05221172170"},{"bando_id":"2174","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","discipline_nomi":"Disegno e illustrazione","discipline_descrizione":"Il settore si articola in due ambiti: disegno e illustrazione. L’ambito del disegno comprende i contenuti artistici e scientifico-disciplinari e della ricerca che riguardano la formazione teorico-pratica e laboratoriale della cultura del disegno nell’accezione più ampia che comprende sia gli aspetti teorici che le indagini storiche sul disegno nei settori delle arti visive. Gli aspetti laboratoriali ed in particolare l’uso di strumenti e supporti legati tanto alle tecniche analogiche della tradizione quanto alle nuove tecnologie verranno considerati come finalità descrittive-progettuali ed espressive del disegno, visto come elemento di rappresentazione e come forma artistica autonoma ed applicata. I contenuti disciplinari dell’illustrazione riguardano gli ambiti propri della comunicazione visiva che utilizza la rappresentazione e la narrazione per immagini. Il settore comprende teorie, ricerche, metodi, tecniche e saperi impiegati per la progettazione e realizzazione di strutture narrative e discorsive visive. Le componenti tecniche e culturali offerte sono volte al raggiungimento di finalità eterogenee. L’attività teorico-pratica e laboratoriale ha finalità tecnico-espressive realizzate attraverso interconnessioni con altri linguaggi e relazioni con diverse tecniche grafiche, da quelle tradizionali alle nuove tecnologie digitali in tutte le declinazioni possibili dell’illustrazione (naturalistica, del libro d’arte e per l’infanzia) fino all’Intelligenza Artificiale","codice_sector":"AFAM077","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"28-08-2026","ultimo_giorno_candidatura":"16-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9906/download/BANDO","https://afam-anagrafiche.mur.gov.it/9905/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=00c194c9fceb4ddab2d31a8f874555da","email_rup":"pec@pec.accademiabelleartiverona.it","telefono_rup":"0458000082"},{"bando_id":"2174","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","discipline_nomi":"Storia delle arti visive","discipline_descrizione":"Il settore comprende gli studi e le ricerche di carattere teorico, storico, metodologico negli ambiti della storia delle arti visive dall’antichità ai nostri giorni con particolare riferimento alla cultura occidentale per un’interpretazione critica delle manifestazioni artistiche dell’essere umano. La storia dell’arte è intesa elemento identitario della cultura in Italia e nell’ambito degli studi nel settore AFAM, nonché quale fattore necessario di consapevolezza civile sulla centralità del patrimonio artistico, la sua conservazione, tutela, valorizzazione e la sua trasmissione al futuro. Sono prese in esame con metodo interdisciplinare e nell’ottica della complessità le opere architettoniche, scultoree, pittoriche, grafiche fotografiche, installative e performative, con particolare attenzione agli agenti e ai fattori sociali che concorrono alla loro produzione nel contesto storico e culturale di appartenenza, nonché lo studio degli artisti, delle poetiche e dei movimenti artistici e il loro impatto sulla società. La disciplina studia le conseguenti modificazioni dei linguaggi anche in funzione dei cambiamenti delle tecniche e delle pratiche artistiche all’interno dell’orizzonte storico sociologico, estetico e culturale, dalle origini fino alle più attuali tendenze artistiche, non solo nelle tradizionali espressioni, ma anche con riferimento alle culture sceniche, coreografiche e filmiche, nonché in relazione alla produzione della società industriale e postindustriale, inclusa l’interazione e la contaminazione tra i nuovi e diversi linguaggi visivi, multimediali e con l’Intelligenza Artificiale. Include gli studi e le ricerche di iconografia e iconologia, di sociologia dell’arte, nonché quelli di carattere teorico e metodologico inerenti la critica d’arte, la letteratura artistica, la storia e la metodologia della storia dell’arte, la storia del collezionismo, la museologia, le relazioni tra le arti visive e le arti performative. Comprende infine gli studi le ricerche sulle tecniche artistiche, la storia e la teoria della conservazione e del restauro del patrimonio e le problematiche di conservazione dell’arte contemporanea","codice_sector":"AFAM102","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"28-08-2026","ultimo_giorno_candidatura":"16-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9906/download/BANDO","https://afam-anagrafiche.mur.gov.it/9905/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=00c194c9fceb4ddab2d31a8f874555da","email_rup":"pec@pec.accademiabelleartiverona.it","telefono_rup":"0458000082"},{"bando_id":"2174","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","discipline_nomi":"Scienze e diagnostica per il restauro","discipline_descrizione":"I contenuti scientifico - disciplinari mirano a trattare gli elementi fondamentali della chimica utili per analizzare in modo critico le componenti organiche e inorganiche dei materiali costitutivi delle opere d’arte e dei prodotti/sistemi utilizzati per il restauro. Vengono altresì studiati i fenomeni di degrado chimico-fisico e biologico della materia utili a riconoscere e comprendere le alterazioni e le interazioni tra i materiali costitutivi delle opere d’arte. Vengono affrontate le questioni riguardanti i fenomeni di interazione tra manufatto e ambiente, gli esami d’insieme delle opere utili ad analizzare l’integrità dei materiali e descriverne in modo quali-quantitativo, attraverso analisi strumentali di laboratorio e per immagini, l’evoluzione delle proprietà fisico-chimiche. Sono comprese le prove pratiche di laboratorio. Si compone di quattro aree o ambiti. Il settore comprende lo studio della chimica generale e inorganica. Si occupa delle proprietà chimiche degli elementi e dei loro composti inorganici, di origine naturale e sintetica. Comprende lo studio della chimica organica, dei composti del carbonio, sia di origine naturale sia sintetica, nei loro aspetti teorici e applicativi. Riguarda lo studio delle proprietà chimiche e tecnologiche dei materiali polimerici, del loro impiego e dei fenomeni di degrado ad essi associati. Comprende lo studio delle classi dei materiali utilizzati per il restauro e le tecnologie ad essi associate. Tali conoscenze saranno la base per intervenire in modo consapevole sui beni culturali nelle fasi di restauro e conservazione Il settore mira a far acquisire le conoscenze di base di biologia cellulare e microbiologia ambientale, le conoscenze sulle caratteristiche biologiche dei principali biodeteriogeni dei beni culturali, sui principali meccanismi di degrado biologico e sull’ecologia del degrado. Infine, approfondisce le conoscenze sui metodi di controllo degli infestanti e dei contaminanti. Comprende lo studio delle classi dei materiali utilizzati per i trattamenti biocidi. Tali conoscenze saranno la base per intervenire in modo consapevole sui beni culturali nelle fasi di restauro e conservazione. Il settore comprende le conoscenze di base di mineralogia e di petrografia per riconoscere i pigmenti, i minerali e le rocce impiegate nei beni culturali. Fornisce competenze relative alla classificazione, alla struttura, alla composizione e alle proprietà fisiche dei minerali che costituiscono i lapidei naturali ed artificiali di interesse storico-artistico ed archeologico, sottolineando le trasformazioni fisico-chimiche che possono interessare i materiali in opera ed essere la causa di alterazione e di degrado. Tali conoscenze saranno la base per intervenire in modo consapevole sui beni culturali nelle fasi di restauro e conservazione Il settore comprende lo studio della fisica di base necessario alla trattazione dell’ottica e delle proprietà di propagazione e interazione dei fotoni e delle particelle con la materia. Le competenze di questo settore riguardano la ricerca nel campo dell’archeometria e delle tecniche ad immagine multispettrale attraverso lo studio scientifico, con analisi di laboratorio, dei materiali di cui i beni di interesse storico, archeologico, artistico e architettonico sono costituiti e dei contesti naturali in cui tali beni si sono ritrovati nel tempo. Lo studio della diagnostica dei beni culturali comprende la conoscenza dei principali fenomeni chimici e fisici alla base del degrado dei beni culturali e comprende l’acquisizione delle tecniche di monitoraggio dei parametri ambientali .","codice_sector":"AFAM120","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"28-08-2026","ultimo_giorno_candidatura":"16-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9906/download/BANDO","https://afam-anagrafiche.mur.gov.it/9905/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=00c194c9fceb4ddab2d31a8f874555da","email_rup":"pec@pec.accademiabelleartiverona.it","telefono_rup":"0458000082"},{"bando_id":"2174","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","discipline_nomi":"Restauro dei manufatti dipinti su supporto ligneo e tessile. Manufatti scolpiti in legno e/o polimaterici, naturali o policromi, arredi e strutture lignee. Manufatti in materiali sintetici lavorati, assemblati e/o dipinti.","discipline_descrizione":"I contenuti scientifico-disciplinari del settore artistico disciplinare in questione comprendono i fondamenti teorico critici e pratici relativi all’attività di conservazione e restauro dei manufatti dipinti su supporto ligneo e tessile. Manufatti scolpiti in legno e/o polimaterici, naturali o policromi, arredi e strutture lignee. Manufatti in materiali sintetici lavorati, assemblati e/o dipinti. I suddetti contenuti abbracciano la ricerca necessaria alla comprensione delle tecniche e dei materiali costitutivi, dei fenomeni di degrado e delle loro cause; la disamina delle differenti metodologie e tecniche di intervento al fine di predisporre un progetto e l’esecuzione dell’intervento di restauro. Comprendono altresì le conoscenze relative ad interventi di manutenzione che contemplano sia la conservazione preventiva dei manufatti in questione sia i restauri indiretti, ovvero relativi al contesto ambientale dell’opera. Il settore prevede un approccio che, partendo dalle problematiche relative alle differenti tecniche storiche di produzione, individui e risolva sul piano praticooperativo gli snodi critici connessi alle varie condizioni in cui viene ad essere effettuato l’intervento di restauro. Il settore si articola in tre aree: restauro e tecniche dei manufatti dipinti su supporto ligneo e tessile (comprende i fondamenti teorico critici e operativi richiesti dall’attività di conservazione e restauro di materiali e manufatti dipinti su supporto ligneo e tessile, compresi i prodotti e le opere dell’arte contemporanea e di design in cui l’impiego di questi materiali è prevalente); restauro e tecniche dei manufatti scolpiti in legno e/o polimaterici, naturali o policromi, arredi e strutture lignee (comprende i fondamenti teorico critici e operativi richiesti dall’attività di conservazione e restauro di manufatti scolpiti in legno e/o polimaterici, naturali o policromi, arredi e strutture lignee comprese le opere e i prodotti dell’arte contemporanea e di design in cui l’impiego di questi materiali è prevalente); e, infine, restauro e tecniche dei manufatti e materiali sintetici lavorati, assemblati e/o dipinti (comprende i fondamenti teorico critici e operativi richiesti dall’attività di conservazione e restauro di Manufatti in materiali sintetici lavorati, assemblati e/o dipinti , nell’accezione più ampia comprese le opere e i prodotti dell’arte contemporanea e di design in cui l’impiego di questi materiali è prevalente)","codice_sector":"AFAM123","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"28-08-2026","ultimo_giorno_candidatura":"16-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9906/download/BANDO","https://afam-anagrafiche.mur.gov.it/9905/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=00c194c9fceb4ddab2d31a8f874555da","email_rup":"pec@pec.accademiabelleartiverona.it","telefono_rup":"0458000082"},{"bando_id":"2170","istituto":"ACCADEMIA DI BELLE ARTI DELL'AQUILA","discipline_nomi":"Grafica d'arte","discipline_descrizione":"I contenuti artistici e tecnico scientifici del settore riguardano la ricerca e la sperimentazione dei linguaggi visivi e percettivi, l’analisi dei processi creativi e grafico espressivi nell’accezione metaforica, antropologica e simbolica delle molteplici forme della comunicazione e nell’interazione tra segno e messaggio. Il settore include competenze e ambiti di ricerca relativi alla lettura storica e contemporanea dei linguaggi visivi della grafica d’arte, agli aspetti che includono le tecniche e la tecnologia dei materiali, con particolare attenzione alla sostenibilità nonché lo studio del segno nella complessità tonale e semantica, fino ai processi artistico-tecnico-culturali della divulgazione e fruizione dell’immagine. La prassi laboratoriale si avvale della conoscenza metodologica di strumenti, mezzi, supporti e materiali tipici della stampa, a cominciare dalla carta e dagli inchiostri, dell’elaborazione delle matrici grafiche, dell’acquisizione della manualità delle tecniche calcografiche, xilografiche, litografiche e della stampa d’arte e della stampa manuale e digitale, dall’esemplare unico alla produzione seriale, fino alla sperimentazione delle più innovative pratiche tecnologiche e multimediali della contemporaneità, compresi gli aspetti tecnico-industriali, editoriali e di ricerca propri del processo divulgativo dell’immagine in ambito visivo","codice_sector":"AFAM076","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"AQUILA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"25-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9881/download/BANDO","https://afam-anagrafiche.mur.gov.it/9880/download/BANDO","https://afam-anagrafiche.mur.gov.it/9879/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=fbe9d76bfdd445e68161ea3781479f37","email_rup":"direttore@abaq.it","telefono_rup":"0862 317380 317360"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Diritto delle arti, del design, dello spettacolo e dei beni culturali","discipline_descrizione":"Il settore comprende competenze e ambiti di ricerca inerenti al diritto dei beni e delle attività culturali, al diritto del lavoro e della previdenza sociale con particolare riguardo all’ambito artistico e dello spettacolo, alla proprietà intellettuale – incluso il diritto d’autore – nel contesto nazionale e internazionale in una prospettiva di comparazione, alla gestione delle imprese operanti nel mondo delle arti e dello spettacolo ed ai relativi sistemi produttivi-industriali, anche legati allo sviluppo delle nuove tecnologie e delle intelligenze artificiali, alla legislazione di cantiere e in materia di sicurezza sul lavoro, nonché all’ordinamento scolastico e dell’Alta Formazione Artistica e Musicale. Completano il settore gli studi riguardanti il rapporto tra diritto e discipline umanistiche, nelle varie declinazioni riconosciute","codice_sector":"AFAM058","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Economia, management marketing delle imprese culturali creative e dello spettacolo","discipline_descrizione":"Il settore si occupa di aspetti economici, gestionali, di marketing, di comunicazione e ricerca specifici per le industrie culturali e creative, dalle arti visive, cinematografiche e audiovisive allo spettacolo dal vivo, dall’organizzazione di eventi al design e alla tutela e valorizzazione del patrimonio culturale. Il settore comprende l’organizzazione e promozione dello spettacolo e di eventi artistici e culturali, il fundraising e il project management","codice_sector":"AFAM059","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Scenografia","discipline_descrizione":"I contenuti del settore fanno riferimento ai diversi ambiti di competenza della ricerca e della progettazione scenografica e scenotecnica per il teatro, il teatro di figura, il cinema, la televisione e i nuovi media. Si contemplano le connessioni con le tecniche e tecnologie della tradizione e del contemporaneo, incluse le modalità di restituzione grafica, pittorica, plastica e la rappresentazione esecutiva dello spazio scenico. I contenuti disciplinari comprendono: la progettazione per il teatro (dalla prosa al teatro musicale alle sperimentazioni drammaturgiche, musicali e coreutiche in spazi tradizionali, urbani e di nuova concezione); la progettazione dello spazio per eventi e allestimenti; la progettazione dello spazio scenico, performativo e coreutico; le tecniche di realizzazione per il teatro di figura; la scenografia del cinema comprese le tecnologie per la creazione di ambienti ed architetture virtuali per la produzione filmica, seriale, documentaristica e di sperimentazione; per la televisione di palinsesto, di divulgazione ed intrattenimento compresa la progettazione e restituzione in spazi e set tradizionali ed ambienti virtuali o di nuova concezione. Si contempla la progettazione e la ricerca con una particolare attenzione al ciclo di vita delle realizzazioni scenografiche, nell’ottica della sostenibilità e dell’economicità","codice_sector":"AFAM072","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Lighting design","discipline_descrizione":"Il settore affronta i fondamenti dell’illuminazione, lo studio e la ricerca sulla luce naturale e artificiale, in funzione degli ambienti, delle cose, degli eventi, degli spettacoli, delle persone. Studia la luce dal punto di vista fisico e percettivo, la sua relazione con gli esseri umani, l’ambiente, i contesti d’uso, i materiali e i colori. Comprende l’illuminotecnica e in particolare: compiti e comfort visivi, misure fotometriche, sorgenti luminose artificiali, calcolo delle ottiche degli apparecchi, applicazione dei più attuali software e dell’Intelligenza Artificiale per il calcolo illuminotecnico. Predispone in fase di progettazione gli impianti elettrici, i sistemi di controllo e, più in generale, la domotica, i relativi protocolli, i dispositivi di gestione e interfacce. Il settore riguarda l’illuminazione architetturale, l’illuminazione dei giardini e del verde, l’illuminazione museale, monumentale, dei luoghi di culto ed espositiva, l’illuminazione dei locali commerciali, l’illuminazione dei luoghi destinati all’ospitalità, l’illuminazione di spazi pubblici (strade, ospedali, uffici) Comprende inoltre l’illuminazione teatrale, televisiva, cinematografica e più in generale di spettacoli ed eventi. Il settore comprende l’illuminazione artistica intesa come progettazione di installazioni luminose artistiche di tipo statico, dinamico ed interattivo","codice_sector":"AFAM074","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Anatomia artistica e rappresentazioni del corpo","discipline_descrizione":"artistica e rappresentazioni del corpo I contenuti artistico-disciplinari e scientifici dell’Anatomia artistica riguardano la rappresentazione e l’illustrazione scientifica del corpo umano, sia sul piano espressivo che della comunicazione visiva, e le relative conoscenze strutturali, morfologiche, antropometriche e simboliche. Il settore include competenze e ambiti di ricerca concernenti la lettura storica e contemporanea della forma umana e del corpo nell’arte, dall’antichità ai nostri giorni, compresi la storia della disciplina, lo sviluppo delle teorie e dei metodi, la relazione del corpo con l’ambiente, naturale e costruito. Include inoltre lo studio del corpo umano come modello per la struttura organica dell’opera d’arte, nell’ampia accezione di riferimento e mezzo conoscitivo delle regole che definiscono la forma, fino all’atto espressivo autoreferenziale. La metodologia formativa e di ricerca si avvale anche di strumenti interdisciplinari in relazione con le altre forme del sapere; il metodo morfologico si estende all’analisi dell’opera d’arte e alla rappresentazione del mondo naturale. L’attività laboratoriale ha finalità sia espressive sia analitico-descrittive e si realizza mediante il disegno e le altre tecniche tradizionali, dei nuovi media, della multimedialità e dell’Intelligenza Artificiale","codice_sector":"AFAM075","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Disegno e illustrazione","discipline_descrizione":"Il settore si articola in due ambiti: disegno e illustrazione. L’ambito del disegno comprende i contenuti artistici e scientifico-disciplinari e della ricerca che riguardano la formazione teorico-pratica e laboratoriale della cultura del disegno nell’accezione più ampia che comprende sia gli aspetti teorici che le indagini storiche sul disegno nei settori delle arti visive. Gli aspetti laboratoriali ed in particolare l’uso di strumenti e supporti legati tanto alle tecniche analogiche della tradizione quanto alle nuove tecnologie verranno considerati come finalità descrittive-progettuali ed espressive del disegno, visto come elemento di rappresentazione e come forma artistica autonoma ed applicata. I contenuti disciplinari dell’illustrazione riguardano gli ambiti propri della comunicazione visiva che utilizza la rappresentazione e la narrazione per immagini. Il settore comprende teorie, ricerche, metodi, tecniche e saperi impiegati per la progettazione e realizzazione di strutture narrative e discorsive visive. Le componenti tecniche e culturali offerte sono volte al raggiungimento di finalità eterogenee. L’attività teorico-pratica e laboratoriale ha finalità tecnico-espressive realizzate attraverso interconnessioni con altri linguaggi e relazioni con diverse tecniche grafiche, da quelle tradizionali alle nuove tecnologie digitali in tutte le declinazioni possibili dell’illustrazione (naturalistica, del libro d’arte e per l’infanzia) fino all’Intelligenza Artificiale","codice_sector":"AFAM077","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Metodologia della progettazione","discipline_descrizione":"I contenuti artistico-scientifici e didattico-formativi riguardano l’insieme dei metodi e saperi, artistici e tecnici, teorici e applicati, consolidati e sperimentali, che guidano alla definizione di un’opera attraverso i molteplici percorsi possibili di ricerca progettuale. Il settore definisce da un punto di vista metodologico e progettuale, a tutte le scale, il rapporto tra il progetto, l’opera compiuta ed i processi e le strategie per realizzarla, inclusi quelli metaprogettuali, chiarendo, nella sintesi dell’opera, le correlazioni tra idea e immagine, composizione e rappresentazione, spazio e oggetto, forma e funzione, struttura e tecnologia, morfologia e tipologia. Il settore comprende le competenze e contenuti tradizionali già collaudati e contemporanei della metodologia per la progettazione in tutti gli ambiti delle arti e del Design, in qualunque contesto, reale o virtuale. I contenuti si estendono all’analisi e alla cultura del progetto, base teorico-critica per la comprensione e la lettura delle opere e dei processi che le determinano, includendo la ricerca e gli sviluppi generativi dell’Intelligenza Artificiale. Il settore include il basic design che è una disciplina propedeutica essenziale per la formazione del designer. Si concentra sull’acquisizione di metodologie progettuali e di ricerca attraverso l’osservazione e la sperimentazione delle forme, promuove una visione multidimensionale per la gestione di progetti di design di prodotto e grafico, sviluppa la comprensione dei fenomeni formali e delle innovazioni tipologiche 2:D e 3:D e favorisce il pensiero critico e metaprogettuale per affrontare le sfide contemporanee della professione","codice_sector":"AFAM078","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Metodi e strumenti per la rappresentazione del progetto","discipline_descrizione":"Il settore disciplinare si fonda sull’assunto culturale che la rappresentazione sia un’estensione del pensiero e un linguaggio universalmente riconosciuto di comunicazione. L’attività di ricerca, progettuale, artistica e didattico-formativa, sia teorica sia pratica, comprende l’insieme dei saperi, delle teorie, dei metodi e delle tecniche per la produzione di rappresentazioni bidimensionali e tridimensionali, sia analogiche sia digitali sia post-digitali, relative alle attività di ideazione alle diverse scale, dello spazio, del manufatto e dell’oggetto, sia reali sia immaginate, compresi i beni culturali","codice_sector":"AFAM083","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Design della comunicazione","discipline_descrizione":"Il Design della Comunicazione è una disciplina fondamentale nella creazione e attuazione di strategie di comunicazione efficaci, chiare e coinvolgenti. Si occupa dell’architettura dell’informazione, di trasmettere valori e obiettivi di prodotti, servizi, processi e iniziative combinando elementi strutturati di visual design, tecniche di narrazione e psicologia della percezione per spazi o ambienti pubblici e privati ad uso mostre, convegni, eventi culturali e di pubblica utilità, anche mediante sistemi di wayfinding. Il Design della Comunicazione mira a stabilire connessioni tra marchi, istituzioni e persone, sostenendo un impatto positivo sia nel tessuto sociale che culturale. Nell’ambito pubblico, svolge un ruolo cruciale nell’informare sulle questioni socialmente rilevanti, facilitando la partecipazione civica e promuovendo una maggiore consapevolezza collettiva. Nel settore privato, supporta con efficacia il branding e la fidelizzazione, migliorando la comunicazione dei valori aziendali attraverso pubblicità, identità di marca e comunicazione digitale. Il Design della Comunicazione si adatta e anticipa i mutamenti culturali, sociali e tecnologici, promuovendo l’innovazione attraverso la ricerca e l’esplorazione di forme innovative di interazione e narrazione. L’etica del design si impegna per il superamento dei bias impliciti e dei pregiudizi culturali e di genere, incoraggiando pratiche inclusive ed eque","codice_sector":"AFAM086","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Design del prodotto","discipline_descrizione":"Il Design del Prodotto riguarda i temi della ricerca e della progettazione di prodotti che soddisfino le esigenze funzionali, ergonomiche, formali, sociali ed etiche in sintonia con le esigenze del mercato e del benessere, nell’ottica degli obiettivi imprescindibili di una progettazione attenta e sostenibile per l’uomo, l’ambiente e le altre forme di vita che popolano il pianeta. I designer del prodotto lavorano su soluzioni innovative di processo o di prodotto che migliorino la vita quotidiana degli utenti e delle comunità, che rispondano a sfide tecnologiche, di innovazione tipologica, filosofiche e produttive contemporanee, che siano in grado di interpretare il futuro, attraverso un processo che abbracci la ricerca, la progettazione e lo sviluppo formale e per il tramite dell’uso di materiali congrui e sostenibili, anche di tipo avanzato. Il design del prodotto mira a sviluppare le idee progettuali in elaborati prevalentemente materiali, a supporto di un miglioramento della vita e del progresso sociale ed economico, tramite una solida formazione di base nell’ambito delle discipline del progetto, sia a livello interdisciplinare teorico e operativo. Il settore include inoltre la riflessione critica e la pratica responsabile del design, valutandone l’impatto sui sistemi complessi e le implicazioni morali, sociali, culturali e ambientali, promuovendo valori come integrità, giustizia, rispetto, sostenibilità e responsabilità, superando bias impliciti e pregiudizi per favorire pratiche inclusive. L’etica del design incoraggia comportamenti trasparenti e rispettosi, adattandosi alle sfide digitali e globali, mantenendo il benessere umano e l’equilibrio ambientale come priorità","codice_sector":"AFAM087","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Design degli ambienti","discipline_descrizione":"I contenuti scientifico-disciplinari del settore riguardano i principi teorici, le metodologie e gli strumenti operativi nell’ambito della progettazione dell’architettura di interni, dell’allestimento espositivo della progettazione di esposizioni temporanee e museali, dell’arredo urbano, deldesign degli oggetti per l’arredamento di spazi pubblici e privati. I diversi indirizzi progettuali sono intesi quali ambiti di ricerca e di sperimentazione per lo sviluppo di progetti innovativi in relazione agli aspetti e alle problematiche sociali, culturali e ambientali, alle ragioni produttive e di mercato. Il settore considera i principi tecnici e i processi tecnologici, fornisce le conoscenze per la valutazione dei bisogni funzionali ed ergonomici considerando i diversi aspetti fisici, percettivi, cognitivi. I contenuti disciplinari permettono inoltre di comprendere ed elaborare le tendenze estetico-formali e di considerare l’evoluzione storica dei comportamenti e dei linguaggi riferibili alla cultura dell’abitare. Le discipline del settore curano in modo particolare la ricerca di soluzioni innovative sia per quanto riguarda l’ideazione, sia per quanto attiene all’articolazione dei percorsi espositivi e agli strumenti comunicativi","codice_sector":"AFAM088","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Systemic design","discipline_descrizione":"Il settore Systemic Design studia i processi, i modelli e i metodi per la progettazione di sistemi complessi (multidimensionalità, non linearità, autonomia e adattamento, evoluzione e coevoluzione), nella loro articolazione di sistemi integrati di progetto al fine di prevederne i comportamenti e di ottimizzarne le prestazioni. Il settore introduce ad una visione sistemica specifica per il designer laddove l’esito dell’analisi e della ricerca, produca una risoluzione progettuale rispondente in maniera integrale (filiera) alla problematica in oggetto, determinando flussi relazionali (interazioni generanti buone prassi di miglioramento della dimensione comunitaria e di crescita del territorio-impresa) tra i nodi (prodotti e servizi fisici e digitali) e gli attori (imprese, enti, organizzazioni di cittadini) necessariamente coinvolti nel raggiungimento di macro-obiettivi valoriali e strategici di economia-civile. L’innovazione è intesa come organismo di inter-relazioni feconde che, a partire dall’indagine del contesto sociale, identificano le aree di opportunità e attivano una compartecipazione responsabile ed evolutiva, in ottica di pensiero circolare (sistema emergente auto-organizzante). Sono forniti strumenti concettuali e operativi che permettono di ‘pensare per sistemi’ e ‘per la complessità’, sviluppando capacità gestionali e di pianificazione del progetto, e di coordinamento e direzione delle diverse competenze che concorrono allo sviluppo dei processi innovativi. All’interno di questo quadro complesso, il Design dei Servizi rappresenta una specializzazione del Systemic Design, concentrandosi in modo specifico sulla progettazione e ottimizzazione sistemica dei servizi, siano essi pubblici o privati, che non solo rispondano ai bisogni degli utenti, ma che si integrino perfettamente nei sistemi più ampi di cui fanno parte. Attraverso un approccio centrato sull’utente e la co-creazione, il Design dei Servizi studia le interazioni tra gli utenti e le organizzazioni, cercando di migliorare l’esperienza complessiva e di ottimizzare le prestazioni dei servizi, sempre con una prospettiva sistemica. Il Design dei servizi si fonda su un modello di innovazione continua, capace di gestire la complessità dei sistemi non lineari, con l’obiettivo primario di sviluppare servizi che migliorino la vita delle persone, ponendo particolare attenzione all’impatto sociale generato e alla gestione costante dei feedback","codice_sector":"AFAM089","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Ergonomia","discipline_descrizione":"Il settore intende fornire conoscenze e abilità relative alla cognizione dei principi propri dell’ergonomia, e che pone in grado di analizzare e valutare e progettare i molteplici aspetti che sovrintendono l’interazione tra l’uomo, la macchina e l’ambiente (U/M/A); valutare gli elementi costitutivi di un sistema dato o in corso di progettazione, con lo scopo di definire soluzioni valide per migliorare il benessere psico/fisico delle persone contestualmente alla performance, all’efficienza generale del sistema ed al benessere negli ambienti di lavoro e di vita. I contenuti scientifico-disciplinari del settore riguardano le basi teoriche, le conoscenze legislative, tecniche e normative, le metodologie e la ricerca operative proprie della disciplina; sono inoltre trattati, anche attraverso esercitazioni pratiche, gli aspetti fisici, percettivi e cognitivi che si determinano nelle azioni di relazione e di interazione con le immagini, gli oggetti, lo spazio organizzato. Le discipline sono orientate alle attività di ideazione, di sviluppo e di verifica dei progetti di design. Esse possono riguardare macroaree quali: organizzazione; sfera cognitiva; sovraccarico biomeccanico; agenti fisici (es.: illuminazione, ambiente termico, acustica e vibrazioni; qualità dell’aria; ecc.); progettazione inclusiva e ergonomia del territorio","codice_sector":"AFAM090","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Ingegnerizzazione, matematica e fisica per il design","discipline_descrizione":"Il settore tratta l’ingegnerizzazione del prodotto, inquadrandola come una disciplina interdisciplinare che abbraccia aspetti economici, tecnici e sociali, mirata a ottimizzare i processi produttivi, i materiali e le tecnologie per armonizzare fra loro i requisiti economici, ambientali e prestazionali in fase di progettazione, pre-produzione e produzione. Oltre a considerare la sostenibilità ambientale, sociale ed economica, questo approccio si avvale di competenze in ambito logico-matematico e scientifico. In particolare, la progettazione di prodotti e sistemi implica la conoscenza di principi di fisica applicata al design, calcolo differenziale e integrale, algebra lineare e algoritmi utili alla rappresentazione geometrica e visiva. Il settore include pertanto competenze matematiche e fisiche utili a fornire una base essenziale per l’analisi e la stima dei dati e la comunicazione efficace di informazioni complesse, con un focus sull’ottimizzazione dei processi anche in presenza di vincoli. Inoltre l’adozione di materiali ecocompatibili e processi produttivi a basso impatto energetico in fase progettuale si affianca alla verifica strutturale e prestazionale dei materiali, utilizzando strumenti della fisica applicata. Il settore tratta inoltre sia l’innovazione tecnologica, sia l’uso di modelli matematici e fisici avanzati per migliorare la funzionalità dei prodotti e dei processi produttivi, anche attraverso l’uso di software specifici, attraverso il calcolo e lo sviluppo di soluzioni sostenibili lungo tutto il ciclo di vita del prodotto, dalla progettazione allo smaltimento. Il settore include, ancora, riflessioni storiche e teoriche sui rapporti tra scienza, arte e design, arricchendo il processo progettuale con una prospettiva culturale più ampia. La ricerca operativa e la fisica applicata svolgono un ruolo chiave non solo nell’ottimizzazione produttiva, ma anche nella conservazione del patrimonio culturale","codice_sector":"AFAM091","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Applicazioni digitali per le arti e il design","discipline_descrizione":"Il settore comprende le competenze legate all’applicazione di strumenti digitali evoluti ai linguaggi visivi artistici e performativi, tanto per ciò che concerne gli aspetti sperimentali ed espressivi, quanto per le possibili applicazioni professionali. Questo settore combina pertanto principi artistici e di design, algoritmi di elaborazione, fondamenti di grafica, conoscenze creative e sperimentali, nell’uso di software per la generazione ed elaborazione di immagini anche in movimento. L’approccio alle tematiche che caratterizzano il settore, prevede, in particolare, la trattazione, sotto il profilo teorico, metodologico ed applicativo, dell’immagine bidimensionale e tridimensionale e della sua elaborazione statica ed in movimento anche relativamente a spazi virtuali e in realtà aumentata. Il settore non comprende solo gli ambiti di creazione di immagini, ma anche tutto ciò che concerne la progettazione e la ricerca. L’esperienza laboratoriale costituisce un momento essenziale dell’esperienza formativa in rapporto alle diverse forme di rappresentazione e ai differenti strumenti anche dinamici e interattivi, secondo procedure, tecniche e strumenti di acquisizione, archiviazione, gestione e rappresentazione grafica di dati, anche in tempo reale","codice_sector":"AFAM094","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Teorie e tecniche computazionali","discipline_descrizione":"Il settore si occupa delle attività scientifiche, artistiche, progettuali e didattico-formative legate all’utilizzo di sistemi informatici e di metodi computazionali. Si concentra sulle teorie e le tecniche applicate a forme computazionali per la progettazione e la creazione artistica; sulla programmazione per creare software e prodotti interattivi per la comunicazione; sulle possibilità dei sensori e degli attuatori elettronici per interagire con l’ambiente circostante; sull’uso dell’Intelligenza Artificiale e i suoi metodi e applicazioni in sistemi computazionali tecnologicamente avanzati. La ricerca, la produzione e la didattica si articolano in conoscenze e competenze, teoriche, progettuali e operative, relative alla programmazione computazionale (creative coding), alla progettazione, sviluppo e gestione di prodotti per la comunicazione mediante protocolli Internet (web/mobile programming), alla progettazione e realizzazione di dispositivi capaci di interagire con l’ambiente, in particolare mediante tecniche di sensoristica, microelettronica e robotica (physical computing), alle applicazioni delle tecniche e degli strumenti nell’ambito dell’Intelligenza Artificiale, nonché alla riflessione di carattere filosofico attorno alle tecnologie","codice_sector":"AFAM095","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Sistemi interattivi","discipline_descrizione":"Il settore si interessa all’attività scientifica, artistica e didattico-formativa, sia teorica che pratica, nel campo dei sistemi interattivi e dell’interazione uomo-macchina applicata alla creazione artistica contemporanea e più in generale delle industrie creative e culturali. La ricerca, la produzione e la didattica per l’alta formazione di questo settore si articolano in conoscenze e competenze nella teoria e nelle tecniche per la progettazione, lo sviluppo e la realizzazione di ambienti interattivi, multimediali e immersivi, che prevedono un rapporto attivo tra spettatore e spazio, di ambienti di realtà virtuale, aumentata e mista, di prodotti audiovisivi caratterizzati da funzionalità di interazione per lo spettatore, e di procedure e strumenti finalizzati al design della interazione di un utente con un dispositivo, un’interfaccia, un’opera artisitca, e più in generale con un ambiente digitale interattivo Questo settore si articola in quattro profili principali","codice_sector":"AFAM097","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"26-08-2026","ultimo_giorno_candidatura":"21-09-2026","allegati":["https://afam-anagrafiche.mur.gov.it/9873/download/BANDO","https://afam-anagrafiche.mur.gov.it/9874/download/BANDO","https://afam-anagrafiche.mur.gov.it/9871/download/BANDO","https://afam-anagrafiche.mur.gov.it/9872/download/BANDO","https://afam-anagrafiche.mur.gov.it/9869/download/BANDO","https://afam-anagrafiche.mur.gov.it/9875/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c35884b8b5f24888a9bdca3807b250ac","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2169","istituto":"ISIA DI PESCARA","discipline_nomi":"Linguaggi e tecniche dell'audiovisivo","discipline_descrizione":"II settore disciplinare riguarda il pluralismo dei linguaggi e delle innovazioni nelle tecniche che caratterizzano la contemporaneità, tanto nell’ambito dei linguaggi audiovisivi legati alle tecniche della tradizione, quanto nell’
